<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0e1a">
<title>Cockpit · Einstellungen</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="wrap">
<div id="top"></div>
<div class="content" id="main"></div>
</div>
<script src="assets/cockpit.js"></script>
<script>
(function(){
"use strict";
var C=window.Cockpit;
document.getElementById("top").innerHTML=C.topbar({title:"Einstellungen",icon:"⚙",sub:"Sync & Daten",accent:"#00bcd4",base:""});
var msg=null,rsv=null;
var AREAS=["energie","auto","edelmetall","finanzen","einkaeufe","ferienwohnung","haus","steuer","dokumente","zuordnung","vertraege","zaehler","training","memo"];
var KNAMEN={dokumente:"📂 Dokumente",finanzen:"💶 Finanzen",ferienwohnung:"🏡 Ferienwohnung",vertraege:"📑 Verträge & Fristen",haus:"🏘️ Haus",energie:"🏠 Energie",auto:"🚗 Auto",steuer:"🧾 Steuer",edelmetall:"🪙 Edelmetalle",training:"🏋️ Training",zaehler:"🎯 ThingCounter"};
var NAMES={energie:"Energie",auto:"Auto",edelmetall:"Edelmetalle",finanzen:"Finanzen",einkaeufe:"Einkäufe",ferienwohnung:"Ferienwohnung",haus:"Haus",steuer:"Steuer",dokumente:"Dokumente",zuordnung:"Zuordnungen Buchung ↔ Dokument",vertraege:"Verträge & Fristen",zaehler:"ThingCounter",training:"Training",memo:"Memo & Einkaufsliste"};

function kopf(){document.getElementById("top").innerHTML=C.topbar({title:"Einstellungen",icon:"⚙",sub:"Sync & Daten",accent:"#00bcd4",base:""});try{C.paintStatus();}catch(e){}}
function render(){
  var c=C.getConfig();
  var h='';
  if(msg)h+='<div class="flash'+(msg.warn?" warn":"")+'">'+C.esc(msg.t)+'</div>';
  h+='<div class="panel"><h3>☁ GitHub-Sync</h3>'+
    '<div class="small muted" style="margin-bottom:14px">Deine Daten werden als JSON-Dateien im <b>privaten</b> Repo gespeichert – eine Datei pro Bereich. Die Einstellungen gelten für alle Bereiche und bleiben nur auf diesem Gerät.</div>'+
    fld("Benutzername","owner",c.owner)+fld("Daten-Repo (privat)","repo",c.repo)+fld("Branch","branch",c.branch)+
    '<div class="field"><label>Access-Token (Fine-grained)</label><input id="f_token" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="github_pat_…" value="'+C.esc(c.token)+'"></div>'+
    '<div class="row2"><button class="btn" style="background:#00bcd4" onclick="CP.saveCfg()">🔌 Speichern &amp; testen</button><button class="btn ghost" style="flex:0 0 auto" onclick="CP.logout()">Token entfernen</button></div>'+
    '</div>';
  var lk=C.lockCfg(),pc=C.pinCfg();
  h+='<div class="panel"><h3>🔒 Sperre</h3><div class="small muted" style="margin-bottom:12px;line-height:1.6">Beim Start und nach einer Pause fragt das Cockpit nach deiner PIN. Die PIN gilt nur für dieses Gerät – am Handy und am PC jeweils einmal festlegen (gern dieselbe). Gespeichert wird nur ein verschlüsselter Prüfwert, nicht die PIN selbst.</div>'+
    (pc?'<div style="color:#69f0ae;margin-bottom:10px">✓ PIN aktiv seit '+new Date(pc.created).toLocaleDateString("de-DE")+" ("+pc.n+' Stellen)</div>'+
        '<div class="field"><label>Automatisch sperren nach</label><select onchange="CP.pinMin(this.value)">'+[1,2,5,10,15,30].map(function(m){return '<option value="'+m+'"'+((pc.min||5)===m?" selected":"")+">"+m+" Minute"+(m>1?"n":"")+" ohne Bedienung</option>";}).join("")+"</select></div>"+
        '<details style="margin-top:6px"><summary class="small muted" style="cursor:pointer">PIN ändern oder entfernen</summary>'+
          '<div class="field" style="margin-top:10px"><label>Aktuelle PIN</label><input id="pin0" type="password" inputmode="numeric" autocomplete="off"></div>'+
          '<div class="field"><label>Neue PIN (4–8 Ziffern)</label><input id="pin1" type="password" inputmode="numeric" autocomplete="off"></div>'+
          '<div class="field"><label>Neue PIN wiederholen</label><input id="pin2" type="password" inputmode="numeric" autocomplete="off"></div>'+
          '<div class="row2"><button class="btn" onclick="CP.pinNeu(true)">PIN ändern</button><button class="btn ghost" style="flex:0 0 auto" onclick="CP.pinWeg()">PIN entfernen</button></div></details>'+
        '<button class="btn ghost full" style="margin-top:10px" onclick="Cockpit.lockNow()">🔒 Jetzt sperren</button>'
      :(C.pinSupported()?'<div class="field"><label>PIN festlegen (4–8 Ziffern)</label><input id="pin1" type="password" inputmode="numeric" autocomplete="off"></div>'+
        '<div class="field"><label>PIN wiederholen</label><input id="pin2" type="password" inputmode="numeric" autocomplete="off"></div>'+
        '<button class="btn" onclick="CP.pinNeu(false)">PIN-Sperre einschalten</button>':'<div class="small" style="color:#ffb74d">Dieser Browser unterstützt die PIN-Sperre nicht.</div>'))+
    '<details style="margin-top:14px"'+(lk?" open":"")+'><summary class="small muted" style="cursor:pointer">Alternativ: Displaysperre des Geräts (Fingerabdruck, Windows Hello)</summary><div style="margin-top:10px">'+
    (lk?'<div style="color:#69f0ae;margin-bottom:10px">✓ Aktiv seit '+new Date(lk.created).toLocaleDateString("de-DE")+'</div><button class="btn ghost" onclick="CP.lockOff()">Gerätesperre ausschalten</button>'
       :(C.lockSupported()?'<button class="btn ghost" onclick="CP.lockOn()">Gerätesperre einschalten</button>':'<div class="small" style="color:#ffb74d">Dieser Browser unterstützt die Gerätesperre leider nicht.</div>'))+
    (lk&&pc?'<div class="small muted" style="margin-top:6px">Ist beides eingerichtet, fragt das Cockpit nach der PIN.</div>':"")+"</div></details>"+
    '<div class="small muted" style="margin-top:12px;line-height:1.6">Hinweis: Eine Zugangssperre für die Oberfläche, keine Verschlüsselung. Deine Daten im privaten Repo sind zusätzlich durch den Token geschützt.</div></div>';
  h+='<div class="panel"><h3>🔑 So erstellst du den Token</h3><div class="small" style="line-height:1.7">'+
    '1. Am besten im Browser: <b>github.com → Profilbild → Settings → Developer settings → Personal access tokens → Fine-grained tokens</b><br>'+
    '2. <b>Generate new token</b>, Name z. B. „Cockpit", Ablauf nach Wunsch (max. 1 Jahr)<br>'+
    '3. <b>Repository access: Only select repositories → cockpit-daten</b><br>'+
    '4. <b>Permissions → Repository permissions → Contents: Read and write</b><br>'+
    '5. Generieren, kopieren und oben einfügen<br><br>'+
    '<span class="muted">🔒 Der Token wird nur lokal auf diesem Gerät gespeichert, nie im öffentlichen Code. Auf jedem weiteren Gerät einmal hier eintragen.</span></div></div>';
  /* Kacheln der Startseite (je Gerät) */
  var kc=C.kachelCfg(),ko=C.kachelOrdnung(C.KACHEL_STANDARD);
  h+='<div class="panel"><h3>🧩 Kacheln auf der Startseite</h3><div class="small muted" style="margin-bottom:10px;line-height:1.6">Gilt nur für dieses Gerät – am Handy darf die Reihenfolge anders sein als am PC.</div>'+
    '<div class="row2" style="margin-bottom:10px"><button class="btn'+(kc.mode==="fest"?"":" ghost")+'" onclick="CP.kMode(\'fest\')">Eigene Reihenfolge</button><button class="btn'+(kc.mode==="nutzung"?"":" ghost")+'" onclick="CP.kMode(\'nutzung\')">Nach Nutzung</button></div>'+
    (kc.mode==="nutzung"?'<div class="small muted" style="line-height:1.6">Häufig geöffnete Bereiche stehen vorn (zählt die Aufrufe von der Startseite, ältere Nutzung zählt nach und nach weniger). Bei Gleichstand gilt die eigene Reihenfolge.</div>':
    ko.map(function(id,i){return '<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-top:'+(i?"1px solid var(--border)":"none")+'"><span style="flex:1">'+C.esc(KNAMEN[id]||NAMES[id]||id)+'</span>'+
      '<button class="btn ghost" style="flex:0 0 auto;padding:4px 10px" onclick="CP.kMove(\''+id+'\',-1)"'+(i?"":" disabled")+' aria-label="nach oben">↑</button><button class="btn ghost" style="flex:0 0 auto;padding:4px 10px" onclick="CP.kMove(\''+id+'\',1)"'+(i<ko.length-1?"":" disabled")+' aria-label="nach unten">↓</button></div>';}).join("")+
    '<button class="btn ghost full" style="margin-top:10px" onclick="CP.kReset()">Standard-Reihenfolge</button>')+"</div>";
  /* Sicherung */
  var have=AREAS.filter(function(a){return C.getLocal(a,null)!=null;}),lb=C.lastBackup();
  h+='<div class="panel"><h3>💾 Sicherung aller Bereiche</h3><div class="small muted" style="margin-bottom:12px;line-height:1.6">Eine Datei mit allen Bereichen ('+have.map(function(a){return NAMES[a];}).join(", ")+'). Zugangsdaten (GitHub-Token, Smoobu-Schlüssel) sind <b>nicht</b> enthalten. Die Datei enthält aber deine Finanzdaten – bitte sicher ablegen, nicht öffentlich teilen.<br>Letzte Sicherung: <b>'+(lb?new Date(lb).toLocaleDateString("de-DE"):"noch nie")+'</b></div>'+
    '<div class="row2">'+(C.canShareFiles()?'<button class="btn" style="background:#00bcd4" onclick="CP.bk(true)">📤 Teilen …</button>':'')+'<button class="btn'+(C.canShareFiles()?' ghost':'')+'" style="'+(C.canShareFiles()?'':'background:#00bcd4')+'" onclick="CP.bk(false)">💾 Als Datei speichern</button></div>'+
    '<label class="btn ghost full" style="display:block;text-align:center;margin-top:10px;cursor:pointer">📂 Sicherung einlesen<input type="file" accept=".json,application/json" style="display:none" onchange="CP.rs(this)"></label>';
  if(rsv){h+='<div style="margin-top:14px;border-top:1px solid var(--border);padding-top:12px"><div class="small" style="margin-bottom:8px">Sicherung vom <b>'+(rsv.created?new Date(rsv.created).toLocaleString("de-DE"):"unbekannt")+'</b> – welche Bereiche übernehmen?</div>'+
    Object.keys(rsv.areas).map(function(a){return '<label style="display:flex;gap:10px;align-items:center;padding:6px 0"><input type="checkbox" class="rsa" value="'+a+'" checked> '+C.esc(NAMES[a]||a)+' <span class="small muted">· Stand '+(rsv.areas[a].updatedAt?new Date(rsv.areas[a].updatedAt).toLocaleDateString("de-DE"):"?")+'</span></label>';}).join("")+
    '<div class="small" style="color:#ffb74d;margin:8px 0;line-height:1.5">Die gewählten Bereiche werden durch den Stand der Datei <b>ersetzt</b> und an deine Geräte gesendet. Der bisherige Stand bleibt in der GitHub-Versionsgeschichte erhalten.</div>'+
    '<div class="row2"><button class="btn" style="background:#ff9800" onclick="CP.rsGo()">Übernehmen</button><button class="btn ghost" style="flex:0 0 auto" onclick="CP.rsCancel()">Abbrechen</button></div></div>';}
  h+='</div>';
  h+='<div class="panel"><h3>ℹ Info</h3><div class="small muted" style="line-height:1.7">Status: <span id="stat"></span><br>Gespeicherte Bereiche auf diesem Gerät: '+
    AREAS.filter(function(a){return C.getLocal(a,null)!=null;}).map(function(a){return NAMES[a]||a;}).join(", ")+'</div></div>';
  document.getElementById("main").innerHTML=h;
  var st=document.getElementById("stat");if(st){var el=document.getElementById("cp-sync");st.textContent=el?el.textContent:"";}
}
function fld(l,k,v){return '<div class="field"><label>'+l+'</label><input id="f_'+k+'" autocapitalize="off" autocorrect="off" spellcheck="false" value="'+C.esc(v)+'"></div>';}
function val(k){return document.getElementById("f_"+k).value.trim();}

window.CP={
  saveCfg:function(){
    C.setConfig({owner:val("owner"),repo:val("repo"),branch:val("branch")||"main",token:val("token")});
    if(!C.configured()){msg={t:"Bitte Benutzername, Repo und Token ausfüllen.",warn:true};render();return;}
    msg={t:"Teste Verbindung…"};render();
    C.testConnection().then(function(r){
      if(!r.ok){msg={t:"⚠ "+r.msg,warn:true};render();return;}
      msg=r.warn?{t:"⚠ "+r.warn,warn:true}:{t:"✓ Verbunden – alle Bereiche synchronisieren jetzt automatisch."};
      ["energie","auto","edelmetall","finanzen","ferienwohnung","haus","steuer","dokumente","training"].forEach(function(a){C.pull(a);});
      render();
    }).catch(function(e){msg={t:"⚠ "+e.message,warn:true};render();});
  },
  lockOn:function(){msg={t:"Bitte am Gerät bestätigen …"};render();C.lockEnable().then(function(){msg={t:"✓ Gerätesperre aktiv. Beim nächsten Start wird nach PIN oder Fingerabdruck gefragt."};render();},function(e){msg={t:"⚠ "+(e&&e.name==="NotAllowedError"?"Abgebrochen oder nicht bestätigt.":(e&&e.message||e)),warn:true};render();});},
  pinNeu:function(aendern){var g=function(id){var el=document.getElementById(id);return el?el.value.trim():"";},p1=g("pin1"),p2=g("pin2");
    if(!C.pinOk(p1)){msg={t:"⚠ Die PIN muss aus 4 bis 8 Ziffern bestehen.",warn:true};render();return;}
    if(p1!==p2){msg={t:"⚠ Die beiden Eingaben stimmen nicht überein.",warn:true};render();return;}
    (aendern?C.pinCheck(g("pin0")):Promise.resolve(true)).then(function(ok){if(!ok)throw new Error("Aktuelle PIN falsch.");return C.pinSet(p1);})
      .then(function(){kopf();msg={t:aendern?"✓ PIN geändert.":"✓ PIN-Sperre aktiv. Das Cockpit sperrt sich nach "+(C.pinCfg().min||5)+" Minuten ohne Bedienung."};render();})
      .catch(function(e){msg={t:"⚠ "+(e.message||e),warn:true};render();});},
  pinWeg:function(){var el=document.getElementById("pin0");C.pinRemove(el?el.value.trim():"").then(function(){kopf();msg={t:"PIN-Sperre ausgeschaltet."};render();}).catch(function(e){msg={t:"⚠ "+(e.message||e),warn:true};render();});},
  pinMin:function(m){C.pinMinuten(m);msg={t:"✓ Sperrt nach "+m+" Minute"+(+m>1?"n":"")+" ohne Bedienung."};render();},
  lockOff:function(){if(!confirm("Gerätesperre auf diesem Gerät ausschalten?"))return;C.lockDisable();msg={t:"Gerätesperre ausgeschaltet."};render();},
  bk:function(share){C.saveBackup(C.makeBackup(AREAS,"cockpit"),"cockpit",share).then(function(ok){msg=ok?{t:"✓ Sicherung erstellt"}:{t:"⚠ Sicherung konnte nicht gespeichert werden",warn:true};render();},function(e){if(e&&e.name==="AbortError")return;msg={t:"⚠ "+(e&&e.message||"Teilen nicht möglich"),warn:true};render();});},
  rs:function(inp){var f=inp.files&&inp.files[0];inp.value="";if(!f)return;C.readFile(f).then(function(t){rsv=C.parseBackup(t);
      Object.keys(rsv.areas).forEach(function(a){if(AREAS.indexOf(a)<0)delete rsv.areas[a];});
      if(!Object.keys(rsv.areas).length){rsv=null;msg={t:"⚠ Die Datei enthält keine Cockpit-Bereiche",warn:true};}render();})
    .catch(function(e){msg={t:"⚠ "+(e.message||"Datei konnte nicht gelesen werden"),warn:true};render();});},
  rsCancel:function(){rsv=null;render();},
  rsGo:function(){var sel=[].slice.call(document.querySelectorAll(".rsa:checked")).map(function(x){return x.value;});if(!sel.length)return;
    if(!confirm(sel.map(function(a){return NAMES[a];}).join(", ")+" durch die Sicherung ersetzen?"))return;
    sel.forEach(function(a){C.restoreArea(a,rsv.areas[a],"replace");});rsv=null;msg={t:"✓ Wiederhergestellt: "+sel.map(function(a){return NAMES[a];}).join(", ")};render();},
  kMode:function(m){var c=C.kachelCfg();if(m==="fest"&&c.mode==="nutzung"&&!c.order.length)c.order=C.kachelOrdnung(C.KACHEL_STANDARD);c.mode=m;C.kachelSet(c);render();},
  kMove:function(id,d){var c=C.kachelCfg(),l=C.kachelOrdnung(C.KACHEL_STANDARD),i=l.indexOf(id),j=i+d;if(i<0||j<0||j>=l.length)return;l.splice(i,1);l.splice(j,0,id);c.order=l;c.mode="fest";C.kachelSet(c);render();},
  kReset:function(){var c=C.kachelCfg();c.order=[];c.mode="fest";C.kachelSet(c);msg={t:"✓ Standard-Reihenfolge"};render();},
  logout:function(){C.setConfig({token:""});msg={t:"Token entfernt. Daten bleiben lokal erhalten."};render();C.paintStatus();}
};
C.onStatus(function(){var st=document.getElementById("stat");var el=document.getElementById("cp-sync");if(st&&el)st.textContent=el.textContent;});
render();C.paintStatus();
})();
</script>
</body>
</html>
