<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0e1a">
<title>Cockpit · Haus</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/style.css">
<style>
.filt{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px;}
.yr{display:flex;align-items:center;background:var(--panel);border:1px solid var(--border);border-radius:10px;}
.yr button{background:none;border:none;color:var(--muted);font-size:19px;padding:4px 12px;cursor:pointer;}
.yr b{color:#fff;min-width:44px;text-align:center;}
.pill{border:1px solid var(--border);background:transparent;color:var(--muted);border-radius:20px;padding:6px 12px;font-size:12px;cursor:pointer;}
.pill.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700;}
.row{display:flex;justify-content:space-between;gap:10px;padding:10px 2px;font-size:13px;border-top:1px solid #152038;align-items:flex-start;}
.row:first-child{border-top:none;}
.row .l{min-width:0;flex:1;}
.row .l b{color:#fff;font-size:13px;}
.row .s{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.5;}
.row .r{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;}
.pos{border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--panel2);}
.pos .h{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin-bottom:8px;}
.pos .h b{color:#fff;font-size:14px;}
.pos .h span{font-size:11px;color:var(--muted);}
.g3{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.inp,.sel,textarea.inp{width:100%;background:var(--field);border:1px solid var(--border);border-radius:8px;padding:9px 10px;color:#fff;font-size:14px;}
.inp:focus,.sel:focus{outline:none;border-color:var(--accent);}
.lbl{font-size:11px;color:var(--muted);margin:0 0 4px;}
.chk{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.5;}
.chk b{color:#cbd5e1;}
.up{color:#ff8a80;} .dn{color:#69f0ae;}
.note{font-size:11px;color:var(--muted);line-height:1.6;}
.warnbox{border:1px solid #ff980066;background:#1a1000;color:#ffcc80;border-radius:10px;padding:10px 12px;font-size:12px;line-height:1.6;margin-bottom:14px;}
table.t{width:100%;border-collapse:collapse;font-size:12px;}
table.t th{text-align:right;color:var(--muted);font-weight:500;padding:6px 4px;border-bottom:1px solid var(--border);font-size:11px;}
table.t th:first-child,table.t td:first-child{text-align:left;}
table.t td{padding:7px 4px;border-bottom:1px solid #152038;text-align:right;font-variant-numeric:tabular-nums;}
table.t tr.sum td{font-weight:700;color:#fff;border-top:1px solid var(--border);}
.tscroll{overflow-x:auto;margin:0 -4px;padding:0 4px;}
.big{font-size:26px;font-weight:800;color:#fff;font-variant-numeric:tabular-nums;}
.mini{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;}
.x{background:none;border:none;color:#3a4a6a;font-size:16px;cursor:pointer;}
.unit{font-size:12px;color:#fdba74;font-weight:700;letter-spacing:.05em;margin:14px 0 6px;}
.bel{border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--panel2);}
.bel.miete{border-left:4px solid #fb923c;} .bel.fewo{border-left:4px solid #2dd4bf;} .bel.eigen{border-left:4px solid #64748b;} .bel.leer{border-left:4px dashed #475569;}
.badge{display:inline-block;font-size:10px;border-radius:8px;padding:2px 7px;margin-left:6px;vertical-align:middle;}
.b-miete{background:#fb923c22;color:#fdba74;} .b-fewo{background:#2dd4bf22;color:#5eead4;} .b-eigen{background:#64748b33;color:#cbd5e1;} .b-leer{background:#47556933;color:#94a3b8;}
input[type=file]{display:none;}
.tk{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:13px;border-top:1px solid #152038;}
.tk:first-of-type{border-top:none;} .tk span:first-child{color:var(--muted);} .tk span:last-child{text-align:right;color:#e2e8f0;}
.chipb{display:inline-block;font-size:10.5px;border-radius:8px;padding:1px 7px;background:#fb923c22;color:#fdba74;margin-right:6px;}
.lg{padding:9px 0;border-top:1px solid #152038;font-size:13px;} .lg:first-of-type{border-top:none;}
.lg .w{color:#fde68a;font-variant-numeric:tabular-nums;} .lg .g{font-size:11px;color:var(--muted);margin-top:2px;}
.formbox{border:1px solid var(--border);border-radius:12px;padding:12px;background:var(--panel2);margin:10px 0;}
/* Abrechnung als Dokument (Bildschirm-Overlay, beim Drucken nur das Dokument) */
#docOverlay{display:none;}
body.doc-on #docOverlay{display:block;position:fixed;inset:0;z-index:50;overflow:auto;background:#e9edf3;padding:0 0 40px;}
body.doc-on .wrap{display:none;}
.doc-bar{position:sticky;top:0;display:flex;gap:8px;align-items:center;padding:10px 14px;background:#0d1829;color:#fff;z-index:2;}
.doc{background:#fff;color:#111827;max-width:820px;margin:16px auto;padding:34px 38px;font-size:12px;line-height:1.5;box-shadow:0 2px 12px rgba(0,0,0,.15);}
.doc h1{font-size:18px;margin:18px 0 2px;color:#111827;}
.doc h2{font-size:13px;margin:20px 0 6px;color:#111827;border-bottom:1.5px solid #111827;padding-bottom:3px;}
.doc .sub{color:#4b5563;font-size:11px;}
.doc .absender{font-size:10px;color:#4b5563;border-bottom:1px solid #d1d5db;padding-bottom:2px;margin-bottom:6px;display:inline-block;}
.doc .kopf{display:flex;justify-content:space-between;gap:20px;}
.doc table{width:100%;border-collapse:collapse;}
.doc th{text-align:left;font-weight:600;color:#374151;border-bottom:1px solid #9ca3af;padding:4px 5px;font-size:10.5px;}
.doc td{padding:4px 5px;border-bottom:1px solid #e5e7eb;vertical-align:top;color:#111827;font-size:11px;}
.doc .r{text-align:right;white-space:nowrap;}
.doc tr.tot td{font-weight:700;border-top:1.5px solid #111827;border-bottom:none;}
.doc .erg{margin-top:14px;padding:10px 12px;border:1.5px solid #111827;border-radius:6px;font-size:13px;display:flex;justify-content:space-between;font-weight:700;}
.doc .box{background:#f3f4f6;border:1px solid #e5e7eb;border-radius:6px;padding:9px 11px;margin-top:12px;font-size:10.5px;color:#374151;}
@media print{
  @page{size:A4;margin:16mm 14mm;}
  body{background:#fff!important;padding:0!important;}
  :root{padding:0!important;}
  body.doc-on .doc-bar{display:none!important;}
  body.doc-on #docOverlay{position:static;background:#fff;padding:0;overflow:visible;}
  .doc{box-shadow:none;max-width:none;padding:0;margin:0;}
  .doc tr{page-break-inside:avoid;}
}
</style>
</head>
<body>
<div class="wrap">
<div id="top"></div>
<nav class="tabs" id="tabs"></nav>
<div class="content" id="main"></div>
</div>
<div id="docOverlay"></div>
<script src="../assets/cockpit.js"></script>
<script src="logic.js"></script>
<script src="technik.js"></script>
<script src="../dokumente/logic.js"></script>
<script src="../vertraege/logic.js"></script>
<script>
(function(){
"use strict";
var C=window.Cockpit,HS=window.HAUS,AREA="haus";

/* Datenmodell (privat, im Daten-Repo):
   einheiten [{k,n,flaeche}], belegung [{id,unit,art,name,von,bis,personen,vz,pquelle,pfix,such,anrede,upd,del}],
   jahre {Jahr:{kosten:{k:{betrag,s,such,info}},extra:[],strompreis,zaehler:{unit:[{d,v}]},flaechen,fewoFix,vzIst:{id:betrag},neueVz:{id:{betrag,ab}},versandt:{id:datum},wasserHZ,notiz,upd}},
   einst {vermieter,objekt,bank,frist,apt,upd} */
function blank(){return {einheiten:[],belegung:[],jahre:{},einst:{}};}
function norm(d){d=d&&typeof d==="object"?d:blank();if(d.technik)d.technik=TECH.norm(d.technik);if(!Array.isArray(d.einheiten))d.einheiten=[];if(!Array.isArray(d.belegung))d.belegung=[];if(!d.jahre||typeof d.jahre!=="object")d.jahre={};if(!d.einst||typeof d.einst!=="object")d.einst={};return d;}
function clone(x){return JSON.parse(JSON.stringify(x));}
function merge(l,r){l=norm(clone(l));r=norm(clone(r));var o=blank(),by={};
  r.belegung.concat(l.belegung).forEach(function(b){var a=by[b.id];if(!a||(b.upd||0)>=(a.upd||0))by[b.id]=b;});o.belegung=Object.keys(by).map(function(k){return by[k];});
  Object.keys(Object.assign({},r.jahre,l.jahre)).forEach(function(y){var a=l.jahre[y],b=r.jahre[y];o.jahre[y]=!a?b:!b?a:((a.upd||0)>=(b.upd||0)?a:b);});
  var newer=(l.einst.upd||0)>=(r.einst.upd||0)?l:r;o.einst=newer.einst;if(l.technik||r.technik)o.technik=TECH.merge(l.technik,r.technik);o.einheiten=(newer.einheiten.length?newer:(l.einheiten.length?l:r)).einheiten;
  o._summary=summaryFor(o);return o;}
C.registerMerge(AREA,merge);

var data=norm(C.getLocal(AREA,blank));
var NOW=new Date().getFullYear();
var st={tab:"uebersicht",y:defaultYear(),mieter:null,flash:null,openSeg:null,printFor:null};
function defaultYear(){var ys=Object.keys(data.jahre).map(Number).sort();if(!ys.length)return NOW;if(ys.indexOf(NOW)>-1)return NOW;return ys[ys.length-1];}
function J(y){y=y||st.y;if(!data.jahre[y])data.jahre[y]={kosten:{},zaehler:{}};var j=data.jahre[y];if(!j.kosten)j.kosten={};if(!j.zaehler)j.zaehler={};return j;}
function touch(y){J(y).upd=Date.now();}
function persist(){data._summary=summaryFor(data);C.save(AREA,data);}
function flash(t,warn){st.flash={t:t,warn:!!warn};render();clearTimeout(flash.tm);flash.tm=setTimeout(function(){st.flash=null;render();},warn?4500:2400);}
function fin(){var f=C.getLocal("finanzen",null);return f&&Array.isArray(f.tx)?f.tx:[];}
function bookings(){var f=C.getLocal("ferienwohnung",null);return f&&f.bookings?Object.keys(f.bookings).map(function(k){return f.bookings[k];}):[];}
function R(y){return HS.calc(data,y||st.y,{bookings:bookings(),apt:data.einst.apt});}
function eur(v,d){return C.eur(v,d==null?2:d);}
function raw(v,d){return C.eurRaw(v,d==null?2:d);}
function num(v,d){return C.num(v,d==null?2:d);}
function de(s){return HS.de(s);}
function esc(s){return C.esc(s);}
function summaryFor(d){
  var ys=Object.keys(d.jahre||{}).map(Number).filter(function(y){var k=(d.jahre[y]||{}).kosten||{};return Object.keys(k).some(function(x){return +k[x].betrag>0;});}).sort();
  if(!ys.length)return {k:"—",s:d.einheiten&&d.einheiten.length?"Noch keine Kosten erfasst":"Noch nicht eingerichtet"};
  var y=ys[ys.length-1],r;try{r=HS.calc(norm(d),y,{bookings:bookings(),apt:(d.einst||{}).apt});}catch(e){return {k:"—",s:""};}
  var m=r.mieter.map(function(s){return s.name.replace(/^Familie\s+/,"")+(s.saldo>=0?" Nachz. ":" Guthaben ")+C.eurRaw(Math.abs(s.saldo),0);});
  return {k:"NK "+y,s:m.length?m.join(" · "):"Keine Mieter im Jahr"};
}

/* ---------- Rahmen ---------- */
function render(){
  document.getElementById("top").innerHTML=C.topbar({title:"Haus",icon:"🏘️",sub:"Nebenkosten · Kostenaufteilung",accent:"#fb923c",accent2:"#f97316"});C.paintStatus();
  var tabs=[["uebersicht","📊 Übersicht"],["abrechnung","🧾 Abrechnung"],["kosten","💶 Kosten"],["belegung","👥 Belegung"],["zaehler","🔢 Zähler"],["steuer","🧮 Für die Steuer"],["technik","🔧 Technik"],["einst","⚙️ Einstellungen"]];
  document.getElementById("tabs").innerHTML=tabs.map(function(t){return '<button class="tab'+(st.tab===t[0]?" on":"")+'" onclick="H2.tab(\''+t[0]+'\')">'+t[1]+"</button>";}).join("");
  var h="";if(st.flash)h+='<div class="flash'+(st.flash.warn?" warn":"")+'">'+esc(st.flash.t)+"</div>";
  if(!data.einheiten.length&&st.tab!=="einst"&&st.tab!=="technik")h+='<div class="empty"><div class="big">🏘️</div>Noch keine Wohnungen angelegt.<br><span class="small">Unter Einstellungen die Startdatei importieren oder die Wohnungen anlegen.</span><br><button class="btn" style="margin-top:14px;background:#fb923c" onclick="H2.tab(\'einst\')">Zu den Einstellungen</button></div>';
  else h+=({uebersicht:vDash,abrechnung:vAbr,kosten:vKosten,belegung:vBel,zaehler:vZ,steuer:vSteuer,technik:vTechnik,einst:vEinst}[st.tab])();
  document.getElementById("main").innerHTML=h;
}
/* ---------- Technik: Heizungsanlage ---------- */
var V=window.VERTR;if(V)C.registerMerge("vertraege",V.merge);
function T(){data.technik=TECH.norm(data.technik);return data.technik;}
function heuteIso(){return new Date().toISOString().slice(0,10);}
function dIn(v){return v?de(v):"";}
function tk(l,v){return v==null||v===""?"":'<div class="tk"><span>'+esc(l)+"</span><span>"+v+"</span></div>";}
function n1(v){return v==null||v===""?"":String(v).replace(".",",");}
function vTechnik(){
  var t=T(),a=t.anlage,h="";
  if(!a.waermeerzeuger&&!t.heizkreise.length)return '<div class="empty"><div class="big">🔧</div>Noch keine Heizungsdaten.<br><span class="small">Die Startdatei aus dem Heizungs-Chat einlesen – danach pflegst du Änderungen hier.</span><br>'+
    '<label class="btn" style="display:inline-block;margin-top:14px;background:#fb923c;cursor:pointer">📄 Heizungs-Startdatei einlesen<input type="file" accept=".json,application/json" onchange="H2.tImp(this)"></label></div>';
  /* Anlage */
  var w=a.waermeerzeuger||{},r=a.regler||{},mm=a.mischermodul||{},fb=a.fachbetrieb||{};
  h+='<div class="panel"><h3>🔥 Anlage</h3>'+
    tk("Wärmeerzeuger",esc([w.hersteller,w.modell].filter(Boolean).join(" "))+(w.typ?'<br><span class="small muted">'+esc(w.typ)+(w.leistung_kw?" · "+w.leistung_kw+" kW":"")+"</span>":""))+
    tk("Eingebaut",w.eingebaut?esc(dIn(w.eingebaut)):"")+
    '<div class="tk"><span>Letzte Wartung</span><span><input class="inp" style="width:130px;padding:5px 8px;font-size:13px;text-align:right" placeholder="TT.MM.JJJJ" value="'+esc(dIn(a.letzteWartung))+'" onchange="H2.tWartung(this.value)"></span></div>'+
    tk("Regler",esc([r.modell,r.regelung].filter(Boolean).join(" · "))+(r.montageort?'<br><span class="small muted">'+esc(r.montageort)+"</span>":""))+
    tk("Mischermodul",esc(mm.modell||"")+(mm.hinweis?'<br><span class="small muted">'+esc(mm.hinweis)+"</span>":""))+
    tk("Pumpengruppen",(a.pumpengruppen||[]).map(function(p){return esc([p.hersteller,p.kreis].filter(Boolean).join(" · "))+(p.hinweis?' <span class="small muted">('+esc(p.hinweis)+")</span>":"");}).join("<br>"))+
    tk("Warmwasser",esc((a.warmwasser||{}).typ||""))+
    tk("Fachbetrieb",fb.name?esc(fb.name)+(fb.telefon?'<br><a href="tel:'+esc(String(fb.telefon).replace(/[^0-9+]/g,""))+'" style="color:#fdba74">📞 '+esc(fb.telefon)+"</a>":"")+(fb.web?' · <a href="https://'+esc(String(fb.web).replace(/^https?:\/\//,""))+'" target="_blank" rel="noopener" style="color:#fdba74">Web</a>':""):"")+"</div>";
  /* Heizkreise */
  t.heizkreise.forEach(function(k){var e=k.e||{},op=st.tEdit===k.id;
    h+='<div class="panel"><h3>'+esc(k.id)+" · "+esc(k.name||"")+(k.heizsystem?' <span class="small muted">· '+esc(k.heizsystem)+"</span>":"")+"</h3>";
    var rows=TECH.FELDER.filter(function(f){return e[f.k]!=null&&e[f.k]!=="";});
    h+=rows.length?rows.map(function(f){return tk(f.n,esc(TECH.wert(f,e[f.k])));}).join(""):'<div class="note">'+esc(k.hinweis||"Noch keine Einstellungen erfasst.")+"</div>";
    if(e.fusspunkt!=null&&e.endpunkt!=null)h+='<div class="note" style="margin-top:8px">Soll-Vorlauf laut Heizkurve: '+[-10,0,10,15].map(function(x){return (x>0?"+":"")+x+" °C außen → "+Math.round(TECH.vorlauf(e,x))+" °C";}).join(" · ")+"</div>";
    h+=op?wertForm(k):'<button class="mini" style="margin-top:10px" onclick="H2.tEdit(\''+esc(k.id)+'\')">✏️ Wert ändern</button>';
    h+="</div>";});
  /* Protokoll */
  var log=TECH.aktiv(t.log).sort(function(x,y){return String(y.datum).localeCompare(String(x.datum))||(y.t||0)-(x.t||0);});
  h+='<div class="panel"><h3>📋 Änderungsprotokoll</h3>'+(log.length?log.map(function(g){return '<div class="lg"><span class="chipb">'+esc(g.bereich||"")+"</span><b style=\"color:#fff\">"+esc(g.aenderung||"")+'</b> <span class="small muted">'+esc(dIn(g.datum))+'</span><button class="x" style="float:right" onclick="H2.tLogDel(\''+g.id+'\')" aria-label="Eintrag löschen">×</button>'+
      (g.vorher!==""||g.nachher!==""?'<div class="w">'+esc(g.vorher||"–")+" → "+esc(g.nachher||"–")+"</div>":"")+(g.grund?'<div class="g">'+esc(g.grund)+"</div>":"")+"</div>";}).join(""):'<div class="note">Noch keine Einträge.</div>')+
    (st.tNotiz?notizForm():'<button class="mini" style="margin-top:10px" onclick="H2.tNotiz(1)">＋ Maßnahme eintragen</button>')+"</div>";
  /* Ablesungen */
  var ab=TECH.aktiv(t.ablesungen).sort(function(x,y){return String(y.datum).localeCompare(String(x.datum));});
  h+='<div class="panel"><h3>🌡️ Ablesungen</h3>'+(ab.length?ab.slice(0,st.tAlle?999:8).map(function(x){var dr=TECH.toN(x.druck),warn=dr!=null&&(dr<1||dr>2.5);
      return '<div class="lg"><b style="color:#fff">'+esc(dIn(x.datum))+'</b> <span class="small muted">'+esc(x.kreis||"")+'</span><button class="x" style="float:right" onclick="H2.tAbDel(\''+x.id+'\')" aria-label="Ablesung löschen">×</button><div class="w">'+
        [x.vorlauf!=null&&x.vorlauf!==""?"Vorlauf "+n1(x.vorlauf)+" °C":"",x.ruecklauf!=null&&x.ruecklauf!==""?"Rücklauf "+n1(x.ruecklauf)+" °C":"",x.druck!=null&&x.druck!==""?(warn?'<span style="color:#f87171">':"")+"Druck "+n1(x.druck)+" bar"+(warn?" ⚠</span>":""):"",x.aussen!=null&&x.aussen!==""?"außen "+n1(x.aussen)+" °C":"",x.raum!=null&&x.raum!==""?"Raum "+n1(x.raum)+" °C":""].filter(Boolean).join(" · ")+"</div>"+(x.notiz?'<div class="g">'+esc(x.notiz)+"</div>":"")+"</div>";}).join(""):'<div class="note">Noch keine Ablesungen.</div>')+
    (ab.length>8&&!st.tAlle?'<button class="mini" style="margin-top:8px" onclick="H2.tAlle()">Alle '+ab.length+" zeigen</button> ":"")+
    (st.tAb?ablesForm():'<button class="mini" style="margin-top:10px" onclick="H2.tAb(1)">＋ Ablesung eintragen</button>')+'<div class="note" style="margin-top:8px">Anlagendruck soll bei etwa 1,5 bar liegen – unter 1 bar Wasser nachfüllen.</div></div>';
  h+=vWirkung(t);
  h+='<div class="panel"><h3>Daten</h3><label class="mini" style="display:inline-block;cursor:pointer">📄 Heizungs-Startdatei erneut einlesen<input type="file" accept=".json,application/json" onchange="H2.tImp(this)"></label>'+
    '<div class="note" style="margin-top:8px">Einlesen ergänzt: vorhandene Protokoll-Einträge und Ablesungen bleiben erhalten, die Einstellungen der Heizkreise werden mit der Datei aktualisiert.</div></div>';
  return h;
}
function wertForm(k){var e=k.e||{},f=st.tF||TECH.FELDER[2].k,fd=TECH.feld(f);
  return '<div class="formbox"><div class="lbl">Einstellung</div><select class="sel" onchange="H2.tFeld(this.value)">'+TECH.FELDER.map(function(x){return '<option value="'+x.k+'"'+(x.k===f?" selected":"")+">"+esc(x.n)+(x.u?" ("+x.u+")":"")+"</option>";}).join("")+"</select>"+
    '<div class="g3" style="margin-top:8px"><div><div class="lbl">bisher</div><div style="padding:9px 0;color:#e2e8f0">'+esc(TECH.wert(fd,e[f]))+'</div></div><div><div class="lbl">neu'+(fd.hint?" – "+esc(fd.hint):"")+'</div><input id="tNeu" class="inp" value="'+esc(e[f]!=null?n1(e[f]):"")+'"></div></div>'+
    '<div class="g3" style="margin-top:8px"><div><div class="lbl">Datum</div><input id="tDat" class="inp" value="'+esc(de(heuteIso()))+'" placeholder="TT.MM.JJJJ"></div><div><div class="lbl">Grund (optional)</div><input id="tGrund" class="inp" placeholder="z. B. zu warm im OG"></div></div>'+

  if(!Object.keys(t.wetter).length)return h+'<div class="note" style="margin-bottom:8px">Außentemperaturen für '+esc(t.ort.name||"den Ort")+' werden beim Wetterdienst Open-Meteo abgerufen (nur Ort und Zeitraum).</div><button class="mini" onclick="H2.tWetter(1)">'+(st.tWLauf?"lädt …":"🌤 Außentemperaturen laden")+"</button></div>";
  var W=TECH.wirkung(gas,t.wetter),by={},mx=0;W.monate.forEach(function(m){by[m.ym]=m;});

  var last=W.monate[W.monate.length-1].ym,ms=[];for(var q=23;q>=0;q--){var dd=new Date(+last.slice(0,4),+last.slice(5,7)-1-q,1),k=dd.getFullYear()+"-"+("0"+(dd.getMonth()+1)).slice(-2);ms.push(by[k]||{ym:k,kennzahl:null});}
  ms.forEach(function(m){if(m.kennzahl>mx)mx=m.kennzahl;});
  var aend=TECH.aktiv(t.log).filter(function(g){return /^HK/i.test(g.bereich||"")&&g.datum;}).map(function(g){return g.datum.slice(0,7);});
  if(mx){var W2=340,H=150,pL=30,pB=26,pT=10,bw=(W2-pL-6)/ms.length,s='<svg viewBox="0 0 '+W2+" "+H+'" width="100%" role="img" aria-label="Heizenergie je Heizgradtag pro Monat">';
    for(var g=0;g<=2;g++){var gy=pT+(H-pT-pB)*(1-g/2);s+='<line x1="'+pL+'" y1="'+gy+'" x2="'+(W2-6)+'" y2="'+gy+'" stroke="#1e2a4a" stroke-dasharray="3 3"/><text x="'+(pL-4)+'" y="'+(gy+3)+'" fill="#5c7aaa" font-size="9" text-anchor="end">'+C.num(mx*g/2,1)+"</text>";}
    ms.forEach(function(m,i){var x=pL+i*bw;
      if(aend.indexOf(m.ym)>-1)s+='<line x1="'+(x+bw/2)+'" y1="'+pT+'" x2="'+(x+bw/2)+'" y2="'+(H-pB)+'" stroke="#fde68a" stroke-dasharray="2 2"/><circle cx="'+(x+bw/2)+'" cy="'+pT+'" r="3" fill="#fde68a"><title>Änderung im '+m.ym+"</title></circle>";
      if(m.kennzahl!=null){var bh=(H-pT-pB)*m.kennzahl/mx;s+='<rect x="'+(x+1)+'" y="'+(H-pB-bh)+'" width="'+Math.max(2,bw-2)+'" height="'+bh+'" rx="2" fill="#fb923c"><title>'+m.ym+": "+C.num(m.kennzahl,2)+" kWh je Heizgradtag ("+m.hgt+" HGT)</title></rect>";}
      if(+m.ym.slice(5,7)===1||+m.ym.slice(5,7)===7||i===0)s+='<text x="'+(x+bw/2)+'" y="'+(H-8)+'" fill="#5c7aaa" font-size="9" text-anchor="middle">'+m.ym.slice(2,4)+"/"+m.ym.slice(5,7)+"</text>";});

  if(W.saisons.length)h+='<table class="t" style="margin-top:10px"><tr><th>Heizperiode</th><th>kWh je HGT</th><th>ggü. Vorjahr*</th></tr>'+W.saisons.map(function(p){var d=p.vgl;
      return "<tr><td>"+esc(p.saison)+'<br><span class="small muted">'+p.n+" Mon. · "+C.int(p.heiz)+" kWh · "+C.int(p.hgt)+" HGT</span></td><td><b>"+C.num(p.kennzahl,2)+"</b></td><td>"+(d?'<span class="'+(d.delta<=0?"dn":"up")+'">'+(d.delta>0?"+":"")+d.delta+" %</span>"+'<br><span class="small muted">'+d.monate+" gleiche Mon.</span>":"–")+"</td></tr>";}).join("")+
