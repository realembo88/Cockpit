<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0e1a">
<title>Cockpit · Dokumente</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/style.css">
<style>
.filt{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px;}
.pill{border:1px solid var(--border);background:transparent;color:var(--muted);border-radius:20px;padding:6px 12px;font-size:12px;cursor:pointer;}
.pill.on{background:#0ea5e9;border-color:#0ea5e9;color:#fff;font-weight:700;}
.inp,.sel{width:100%;background:var(--field);border:1px solid var(--border);border-radius:8px;padding:9px 10px;color:#fff;font-size:14px;font-family:inherit;}
.inp:focus,.sel:focus{outline:none;border-color:#0ea5e9;}
.lbl{font-size:11px;color:var(--muted);margin:0 0 4px;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.note{font-size:11px;color:var(--muted);line-height:1.6;}
.mini{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;}
.mini.on{border-color:#22c55e;color:#4ade80;}
.mini:disabled{opacity:.4;cursor:default;}
.doc{border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--panel2);border-left:4px solid #475569;}
.doc.frei{border-left-color:#22c55e;} .doc.vor{border-left-color:#0ea5e9;} .doc.err{border-left-color:#ef4444;} .doc.verw{border-left-color:#f59e0b;opacity:.65;}
.dub{margin-top:7px;font-size:12px;color:#fcd34d;background:#f59e0b14;border:1px solid #f59e0b44;border-radius:8px;padding:7px 9px;line-height:1.45;}
.doc .h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;}
.doc .h b{color:#fff;font-size:13px;word-break:break-all;}
.doc .s{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.5;}
.fn{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:#7dd3fc;word-break:break-all;margin-top:6px;}
.badge{display:inline-block;font-size:10px;border-radius:8px;padding:2px 7px;margin-left:4px;vertical-align:middle;white-space:nowrap;}
.k-hoch{background:#22c55e22;color:#4ade80;} .k-mittel{background:#f59e0b22;color:#fbbf24;} .k-niedrig{background:#ef444422;color:#f87171;} .k-st{background:#8b5cf622;color:#c4b5fd;}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
.box{border-top:1px solid #152038;margin-top:10px;padding-top:10px;}
.chipset{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
.chipset button{border:1px solid var(--border);background:transparent;color:var(--muted);border-radius:14px;padding:3px 10px;font-size:11px;cursor:pointer;}
.chipset button.on{background:#0ea5e933;border-color:#0ea5e9;color:#7dd3fc;}
.run{border:1px solid #0ea5e988;background:#03243a;color:#bae6fd;border-radius:12px;padding:12px;margin-bottom:14px;font-size:13px;line-height:1.5;}
.bar{height:6px;background:#0c3550;border-radius:4px;overflow:hidden;margin-top:8px;} .bar i{display:block;height:100%;background:#0ea5e9;}
.foot{position:sticky;bottom:0;background:linear-gradient(180deg,transparent,var(--bg) 30%);padding:16px 0 6px;}
.row{display:flex;gap:10px;padding:10px 2px;border-top:1px solid #152038;align-items:flex-start;}
.row:first-child{border-top:none;}
.row .l{flex:1;min-width:0;} .row .l b{color:#fff;font-size:13px;font-weight:600;}
.row .l div{font-size:11px;color:var(--muted);margin-top:3px;}
.row .r{text-align:right;white-space:nowrap;font-size:13px;}
.step{display:flex;gap:12px;align-items:flex-start;padding:12px 2px;border-top:1px solid #152038;}
.step:first-child{border-top:none;}
.step .n{width:26px;height:26px;border-radius:50%;background:#0ea5e933;color:#7dd3fc;font-weight:800;display:flex;align-items:center;justify-content:center;flex:0 0 26px;font-size:13px;}
.step .n.ok{background:#22c55e33;color:#4ade80;}
.step .t{flex:1;font-size:13px;color:#e2e8f0;line-height:1.5;}
.step .t div{font-size:11px;color:var(--muted);margin-top:4px;}

.btn:disabled{opacity:.45;cursor:default;}
code{background:var(--field);padding:1px 5px;border-radius:4px;font-size:11px;}
.bon{margin-top:6px;font-size:12px;color:#fde68a;}
.art{font-size:12px;color:#cbd5e1;display:flex;justify-content:space-between;gap:10px;padding:2px 0;}
.art span:last-child{white-space:nowrap;font-variant-numeric:tabular-nums;}
a.dl{color:#7dd3fc;}
#prev{display:none;}
body.prev-on #prev{display:grid;position:fixed;inset:0;z-index:50;background:#060a14;grid-template-rows:auto 1fr;}
#prev .bar2{display:flex;gap:8px;align-items:center;padding:8px 12px;background:#0d1829;color:#fff;font-size:13px;}
#prev .bar2 b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#prev .body{display:grid;grid-template-columns:1fr;min-height:0;}
#prev iframe{width:100%;height:100%;border:0;background:#fff;min-height:55vh;}
#prev .side{overflow:auto;padding:12px;}
@media(min-width:900px){#prev .body{grid-template-columns:1fr 400px;}}
.bz{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-top:5px !important;}
.bzc{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;border-radius:8px;padding:2px 7px;background:#1e293b;color:#cbd5e1;text-decoration:none;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;}
.bzc.gr{background:#22c55e1f;color:#86efac;} .bzc.warn{background:#f59e0b22;color:#fcd34d;}
.bzc button{background:transparent;border:none;color:inherit;font-size:11px;cursor:pointer;padding:0 0 0 2px;opacity:.75;font-family:inherit;}
.bzc button:hover{opacity:1;}
</style>
</head>
<body>
<div class="wrap">
<div id="top"></div>
<nav class="tabs" id="tabs"></nav>
<div class="content" id="main"></div>
</div>
<div id="prev"></div>
<script src="../assets/cockpit.js"></script>
<script src="logic.js"></script>
<script src="../finanzen/einkauf.js"></script>
<script src="../finanzen/logic.js"></script>
<script src="../vertraege/logic.js"></script>
<script src="../auto/logic.js"></script>
<script src="../haus/logic.js"></script>
<script>
(function(){
"use strict";
var C=window.Cockpit,D=window.DOKS,AREA="dokumente",EDIT_KEY="cockpit:dok:edit";

/* Synchronisiert (privates Daten-Repo): nur das Verzeichnis der abgelegten Dokumente (Metadaten) und die Listen aus ablage.py.
   Die PDFs bleiben im Ablage-Ordner auf dem PC. */
function blank(){return D.dokBlank();}
function norm(d){return D.dokNorm(d);}
function merge(l,r){return D.dokMerge(l,r);}
C.registerMerge(AREA,merge);
C.registerMerge("einkaeufe",EINK.merge);
C.registerMerge("zuordnung",D.zuMerge);
var data=norm(C.getLocal(AREA,blank));
function persist(){data.upd=Date.now();data._summary=summaryFor(data);C.save(AREA,data);}
function summaryFor(d){return D.dokSummary(d);}

/* lokale Bearbeitungen der Vorschläge (nicht synchronisiert) */
function loadEdits(){try{return JSON.parse(localStorage.getItem(EDIT_KEY)||"{}")||{};}catch(e){return {};}}
function saveEdits(){try{localStorage.setItem(EDIT_KEY,JSON.stringify(st.edit));}catch(e){}}

var st={tab:"eingang",perm:"…",root:null,rootName:"",pdfs:null,vor:null,edit:loadEdits(),open:{},run:null,flash:null,q:"",fy:"",fb:"alle",fst:false,fohne:false,bz:null,tx:[],txVon:"",zuErg:null,zuWahl:null,limit:60,test:null,prevName:null,prevUrl:null};
function flash(t,warn){st.flash={t:t,warn:!!warn};render();clearTimeout(flash.tm);flash.tm=setTimeout(function(){st.flash=null;render();},warn?6000:3000);}
function esc(s){return C.esc(s);}
function konfig(){return (st.vor&&st.vor.konfig)||data.konfig||{empfaenger:{},archiv:{Privat:[],Geschaeftlich:[]},stb:{Privat:[],Geschaeftlich:[]}};}

/* ---------- Ordner & Daten laden ---------- */
function init(){D.state().then(function(s){st.perm=s.s;st.root=s.s==="granted"?s.h:null;st.rootName=s.h?s.h.name:"";render();if(st.root)reload().then(laufFortsetzen);});}
/* läuft am PC noch ein längerer Vorgang (z. B. Altbestand auslesen)? Dann Fortschritt wieder anzeigen */
function laufFortsetzen(){if(!st.root||st.run)return;D.readJSON(st.root,"_cockpit/status.json").then(function(s){
  if(!s||s.status!=="laeuft"||s.befehl!=="nachlesen"||!s.id||Date.now()-Date.parse(s.zeit)>10*60000)return;
  st.run={cmd:"nachlesen",label:"Altbestand auslesen",msg:s.meldung||"läuft …",i:(s.fortschritt||{}).i||0,n:(s.fortschritt||{}).n||0};render();
  warte("nachlesen","Altbestand auslesen",s.id,8*3600000);}).catch(function(){});}
function reload(){if(!st.root)return Promise.resolve();
  return Promise.all([D.readJSON(st.root,"_cockpit/vorschlaege.json"),D.readJSON(st.root,"_cockpit/index.json"),D.listPDFs(st.root).catch(function(){return null;}),
      D.readJSON(st.root,"_cockpit/einkaeufe.json").catch(function(){return null;}),D.listCSVs(st.root).catch(function(){return [];}),D.readJSON(st.root,"_cockpit/laeden.json").catch(function(){return null;}),
      D.readJSON(st.root,"_cockpit/hausmeister.json").catch(function(){return null;}),D.readJSON(st.root,"_cockpit/hausmeister_einst.json").catch(function(){return null;}),D.readJSON(st.root,"_cockpit/zaehlerstaende.json").catch(function(){return null;})]).then(function(a){
    /* Zählerstände aus Fotos fürs Handy und Energie mitsynchronisieren (nur die Werte, die Fotos bleiben am PC) */
    var zs=zstListe(a[8]);if(zs&&JSON.stringify(zs)!==JSON.stringify(data.zst||null)){data.zst=zs;var ch4=true;}
    /* Hausmeister (automatischer Lauf am PC): Stand fürs Handy und die Startseite mitsynchronisieren – ohne Pfade */
    st.hm=a[6];st.hmE=a[7]||{};var hs=hmSumme(a[6],a[7]);if(JSON.stringify(hs)!==JSON.stringify(data.hm||null)){data.hm=hs;var ch3=true;}
    datenExport();
    /* eigene Ladennamen fürs Python-Skript bereitstellen (gelten dann auch für neue Bons und Dateinamen) */
    var al=EINK.aliase(C.getLocal("einkaeufe",null));if(JSON.stringify(al)!==JSON.stringify((a[5]&&a[5].aliase)||{}))D.writeJSON(st.root,"_cockpit/laeden.json",{version:1,aliase:al}).catch(function(){});
    st.csv=a[4]||[];if((data.kontoCsv||0)!==st.csv.length){data.kontoCsv=st.csv.length;var ch2=true;}
    /* Kassenbons für die Einkaufs-Statistik (Finanzen → Einkäufe) übernehmen */
    var ek=EINK.fromFile(C.getLocal("einkaeufe",null),a[3]);if(ek)C.save("einkaeufe",ek);
    st.vor=a[0]||{dateien:{},konfig:null};st.pdfs=a[2];
    var idx=a[1],changed=false;
    if(idx&&Array.isArray(idx.dokumente)&&String(idx.aktualisiert||"")!==String(data.aktualisiert||"")){data.index=idx.dokumente;data.aktualisiert=idx.aktualisiert||"";changed=true;}
    var k=(idx&&idx.konfig)||(st.vor&&st.vor.konfig);if(k&&JSON.stringify(k)!==JSON.stringify(data.konfig)){data.konfig=k;changed=true;}
    var n=st.pdfs?st.pdfs.length:null;if(n!==data.eingang){data.eingang=n;changed=true;}
    /* Bearbeitungen für Dateien, die nicht mehr im Eingang liegen, aufräumen */
    if(st.pdfs){var names={};st.pdfs.forEach(function(p){names[p.name]=1;});Object.keys(st.edit).forEach(function(k2){if(!names[k2])delete st.edit[k2];});saveEdits();}
    if(changed||ch2||ch3||ch4)persist();render();}).catch(function(e){flash("⚠ Ordner konnte nicht gelesen werden: "+(e.message||e),true);});}

function hmSumme(hm,e){return D.hmSumme(hm,e);}
/* Cockpit-Daten einmal täglich in die Ablage legen – so stecken sie auch in der ZIP-Sicherung des Hausmeisters.
   Ohne Zugangsdaten (Token, Schlüssel) und ohne ThingCounter. Nur, wenn eine Sicherung eingerichtet ist. */
/* Cockpit-Daten täglich in die Ablage (für die ZIP-Sicherung), siehe DOKS.datenExport */
function datenExport(){D.datenExport(C,st.root,st.hmE);}
function zstListe(f){return D.zstListe(f);}
function zeitDe(iso){if(!iso)return "—";var d=new Date(iso);return isNaN(d)?String(iso):d.toLocaleString("de-DE",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});}
function idxById(id){return data.index.filter(function(e){return e.id===id;})[0]||null;}

/* ---------- Python-Lauf ---------- */
function run(cmd,label,ms){if(!st.root){flash("⚠ Zuerst den Ablage-Ordner verbinden",true);return Promise.resolve(null);}
  if(st.run){flash("Es läuft bereits ein Vorgang",true);return Promise.resolve(null);}
  var id=D.newId();st.run={cmd:cmd,label:label,msg:"Wird gestartet … Chrome fragt beim ersten Mal, ob der Link geöffnet werden darf.",i:0,n:0};render();
  D.start(cmd,id);
  return warte(cmd,label,id,ms);}
/* auf das Ende eines Laufs warten (auch für einen Lauf, der vor dem Öffnen der Seite gestartet wurde) */
function warte(cmd,label,id,ms){
  var p=D.poll(st.root,id,function(s){if(!st.run)return;
    /* keine Rückmeldung mehr seit 10 Minuten – Konsolenfenster vermutlich geschlossen */
    if(cmd==="nachlesen"&&s.zeit&&Date.now()-Date.parse(s.zeit)>10*60000){st.run.p&&st.run.p.cancel();flash("Der Lauf meldet sich nicht mehr (Fenster geschlossen?). Erneut starten macht an der Stelle weiter.",true);return;}
    st.run.msg=s.meldung||"läuft …";if(s.fortschritt){var neu=s.fortschritt.i!==st.run.i;st.run.i=s.fortschritt.i;st.run.n=s.fortschritt.n;
      if(cmd==="nachlesen"&&neu&&st.run.i%20===0)reload();}render();},ms||15*60000);
  st.run.p=p;
  return p.then(function(s){st.run=null;
    if(s.status==="timeout")flash("⚠ Keine Rückmeldung vom PC. Ist die Einrichtung erledigt und Chrome danach neu gestartet? Details unter Einrichtung → Verbindung testen.",true);
    else if(s.status==="fehler")flash("⚠ "+(s.meldung||"Fehler im Python-Skript – Details im Konsolenfenster"),true);
    else if(s.status==="fertig")flash("✓ "+(s.meldung||"Fertig"));
    render();return reload().then(function(){return s;});});}

/* ---------- Rahmen ---------- */
function render(){
  document.getElementById("top").innerHTML=C.topbar({title:"Dokumente",icon:"📂",sub:"Scannen · Ablegen · Verknüpfen",accent:"#38bdf8",accent2:"#0284c7"});C.paintStatus();
  var tabs=[["eingang","📥 Eingang"+(st.pdfs&&st.pdfs.length?" ("+st.pdfs.length+")":"")],["archiv","🗂 Archiv"],["einr","⚙️ Einrichtung"]];
  document.getElementById("tabs").innerHTML=tabs.map(function(t){return '<button class="tab'+(st.tab===t[0]?" on":"")+'" onclick="D2.tab(\''+t[0]+'\')">'+t[1]+"</button>";}).join("");
  var h="";if(st.flash)h+='<div class="flash'+(st.flash.warn?" warn":"")+'">'+esc(st.flash.t)+"</div>";
  if(st.run){var pc=st.run.n?Math.round(st.run.i/st.run.n*100):0;h+='<div class="run">⏳ <b>'+esc(st.run.label)+"</b> läuft im Konsolenfenster am PC.<br>"+esc(st.run.msg)+(st.run.n?'<div class="bar"><i style="width:'+pc+'%"></i></div>':"")+'<div style="margin-top:8px"><button class="mini" onclick="D2.cancel()">Nicht mehr warten</button></div></div>';}
  h+=({eingang:vEingang,archiv:vArchiv,einr:vEinr}[st.tab])();
  document.getElementById("main").innerHTML=h;
}
function connectHint(){
  if(st.perm==="unsupported")return '<div class="panel"><b style="color:#7dd3fc">'+(D.mobil()?"Analysieren und Ablegen laufen am PC":"Ablegen geht am PC in Chrome")+"</b>"+
    '<div class="note" style="margin-top:6px">'+(D.mobil()?"Der Ablage-Ordner ist im Chrome am PC verbunden – am Handy ist nichts einzurichten. Hier siehst du das Archiv und die Auswertungen in Finanzen, Haus und Steuer.":"Dieser Browser kann nicht auf Ordner zugreifen. Das Archiv und die Verknüpfungen in Finanzen, Haus und Steuer siehst du trotzdem.")+"</div>"+
    (data.konfig?'<div class="note" style="margin-top:6px">'+(data.eingang?"Beim letzten Abgleich am PC lagen <b>"+data.eingang+" PDF(s)</b> im Eingang.":"Beim letzten Abgleich am PC war der Eingang leer.")+(data.upd?" Stand "+new Date(data.upd).toLocaleString("de-DE",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})+".":"")+"</div>":"")+
    '<div class="acts"><button class="mini" onclick="D2.tab(\'archiv\')">🗂 Archiv</button><a class="mini" style="text-decoration:none;display:inline-block" href="../finanzen/index.html#einkauf">🧾 Einkäufe</a></div></div>';
  if(st.perm==="prompt")return '<div class="panel"><b style="color:#7dd3fc">Zugriff auf „'+esc(st.rootName)+'“ erlauben</b><div class="note" style="margin:6px 0 10px">Chrome fragt nach jedem Neustart einmal nach – mit „Bei jedem Besuch zulassen“ entfällt das.</div><button class="btn" style="background:#0ea5e9" onclick="D2.allow()">Zugriff erlauben</button></div>';
  if(st.perm==="none")return '<div class="panel"><b style="color:#7dd3fc">Noch kein Ablage-Ordner verbunden</b><div class="note" style="margin:6px 0 10px">Einmalig einrichten: Skripte ablegen, Link-Typ registrieren, Ordner verbinden.</div><button class="btn" style="background:#0ea5e9" onclick="D2.tab(\'einr\')">Zur Einrichtung</button></div>';
  return "";
}

/* ---------- Eingang ---------- */
function meta(name){var e=st.vor&&st.vor.dateien&&st.vor.dateien[name];var ed=st.edit[name];return ed&&ed.meta?ed.meta:(e&&e.meta?JSON.parse(JSON.stringify(e.meta)):null);}
function vEingang(){
  var h=connectHint();if(st.perm!=="granted")return h+archivKurz();
  if(st.pdfs==null)return h+'<div class="empty">Lese den Eingang …</div>';
  var neu=st.pdfs.filter(function(p){var e=st.vor.dateien[p.name];return !e||!e.meta||e.fehler||e.groesse!==p.size;}).length;
  h+='<div class="filt"><button class="btn" style="background:#0ea5e9;flex:1" onclick="D2.analyse()"'+(st.run?" disabled":"")+'>🔍 Analysieren'+(neu?" ("+neu+" neu)":"")+'</button><button class="mini" onclick="D2.reload()" aria-label="Neu einlesen">↻</button></div>';
  h+=hmEingang();
  if(st.csv&&st.csv.length)h+='<div class="panel" style="border-color:#e040fb66"><b style="color:#f0a6ff">🏦 '+st.csv.length+(st.csv.length===1?" Kontoauszug":" Kontoauszüge")+' (CSV) im Eingang</b><div class="note" style="margin:6px 0 10px">Werden beim Öffnen von Finanzen automatisch übernommen und archiviert.</div><a class="mini" style="text-decoration:none;display:inline-block" href="../finanzen/index.html#import">💶 Finanzen öffnen</a></div>';
  if(!st.pdfs.length)return h+'<div class="empty"><div class="big">📭</div>Der Eingang ist leer.<br><span class="small">Scans landen in 00_Eingang – danach hier „Analysieren“.</span></div>';
  var k=konfig(),frei=0,sicher=0,verw=0;
  st.pdfs.forEach(function(p){var e=st.vor.dateien[p.name]||{},m=meta(p.name),ed=st.edit[p.name]||{},err=m?D.valid(m,k):"",o=st.open[p.name];
    if(ed.verwerfen)verw++;if(ed.frei&&m&&!err)frei++;if(m&&!err&&!ed.frei&&!m.doppelt&&(m.konfidenz==="hoch"||m.konfidenz==="mittel"))sicher++;
    h+='<div class="doc'+(ed.verwerfen?" verw":ed.frei&&!err?" frei":e.fehler?" err":m?" vor":"")+'"><div class="h"><div style="min-width:0"><b>'+esc(p.name)+"</b>"+
      (m&&m.konfidenz?'<span class="badge k-'+esc(m.konfidenz)+'">'+esc(m.konfidenz)+"</span>":"")+(m&&m.steuerrelevant?'<span class="badge k-st">ST</span>':"")+(m&&m.doppelt?'<span class="badge k-niedrig">'+(m.doppelt_art==="aehnlich"?"doppelt?":"Dublette")+"</span>":"")+
      '<div class="s">'+Math.max(1,Math.round(p.size/1024))+" KB"+(m?" · "+esc(m.archiv_bereich+" / "+m.archiv_kategorie)+(m.steuerrelevant&&m.stb_belegart?" · Steuer "+esc(D.stbJahr(m))+": "+esc(m.stb_belegart):"")+(m.betrag!=null?" · "+C.eur(+m.betrag):""):e.fehler?' · <span style="color:#f87171">'+esc(e.fehler)+"</span>":" · noch nicht analysiert")+"</div>"+
      (m&&m.kassenbon?bonZeile(m.kassenbon):"")+(m?'<div class="fn">'+esc(D.fname(m))+"</div>":"")+(err?'<div class="s" style="color:#fbbf24">⚠ '+esc(err)+"</div>":"")+(m&&m.hinweise&&!m.doppelt?'<div class="s">💡 '+esc(m.hinweise)+"</div>":"")+(m&&m.doppelt?dubZeile(p.name,m,ed):"")+"</div></div>"+
      '<div class="acts"><button class="mini" onclick="D2.prev(\''+jsq(p.name)+'\')">👁 Ansehen</button>'+(m?'<button class="mini" onclick="D2.toggle(\''+jsq(p.name)+'\')">✏️ '+(o?"Schließen":"Bearbeiten")+'</button><button class="mini'+(ed.frei&&!err?" on":"")+'" onclick="D2.frei(\''+jsq(p.name)+'\')"'+(err?" disabled":"")+">"+(ed.frei&&!err?"✓ freigegeben":"☐ freigeben")+"</button>":"")+
