<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0e1a">
<title>Cockpit · Finanzen</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/style.css">
<style>
.pos{color:#69f0ae;} .neg{color:#ff8a80;}
.bar{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:12px;}
.bar .l{flex:0 0 42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text);}
.bar .t{flex:1;height:10px;background:var(--field);border-radius:6px;overflow:hidden;}
.bar .t i{display:block;height:100%;background:var(--accent);border-radius:6px;}
.bar .v{flex:0 0 auto;min-width:70px;text-align:right;font-variant-numeric:tabular-nums;}
.filt{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px;}
.yr{display:flex;align-items:center;background:var(--panel);border:1px solid var(--border);border-radius:10px;}
.yr button{background:none;border:none;color:var(--muted);font-size:19px;padding:4px 12px;cursor:pointer;}
.yr b{color:#fff;min-width:44px;text-align:center;}
.pill{border:1px solid var(--border);background:transparent;color:var(--muted);border-radius:20px;padding:6px 12px;font-size:12px;cursor:pointer;}
.pill.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700;}
.tx{display:flex;justify-content:space-between;gap:10px;padding:11px 2px;border-top:1px solid #152038;}
.tx:first-child{border-top:none;}
.tx .p{color:#fff;font-size:13px;overflow-wrap:anywhere;}
.tx .z{color:var(--muted);font-size:11px;margin-top:2px;overflow-wrap:anywhere;}
.tx .a{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;}
.cat{display:inline-block;margin-top:5px;font-size:11px;padding:2px 8px;border-radius:10px;background:#e040fb1f;color:#f0a6ff;border:none;cursor:pointer;}
.cat.u{background:#ff980022;color:#ffb74d;}
.cat.m::after{content:" ✎";}
.mx td:first-child,.mx th:first-child{position:sticky;left:0;background:var(--panel);z-index:1;cursor:pointer;}
.mx tr.sum td{font-weight:700;background:var(--panel2);}
.mx tr.sum td:first-child{background:var(--panel2);}
.mx td.neutral:first-child{color:var(--muted);font-style:italic;}
.rule{border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--panel2);}
.rule .h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;}
.rule .h b{color:#fff;font-size:14px;}
.rule .tools button{background:none;border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:3px 8px;cursor:pointer;font-size:12px;margin-left:3px;}
.kw{display:inline-flex;align-items:center;gap:4px;font-size:12px;background:var(--field);border:1px solid var(--border);border-radius:14px;padding:3px 4px 3px 10px;margin:3px 4px 3px 0;color:var(--text);}
.kw button{background:none;border:none;color:#5c7aaa;cursor:pointer;font-size:13px;padding:0 4px;}
.addkw{display:flex;gap:6px;margin-top:8px;}
.addkw input{flex:1;background:var(--field);border:1px solid var(--border);border-radius:8px;padding:8px 10px;color:#fff;font-size:13px;}
.note{font-size:11px;color:var(--muted);line-height:1.6;}
.dayh{display:flex;justify-content:space-between;align-items:baseline;padding:12px 2px 6px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--panel);z-index:1;}
.dayh b{color:#fff;font-size:14px;} .dayh span{font-size:12px;}
.dtx{padding:10px 2px 12px;border-bottom:1px solid #152038;}
.dtx:last-child{border-bottom:none;}
.dtx .row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;}
.rem{width:100%;margin-top:8px;background:var(--field);border:1px solid var(--border);border-radius:8px;padding:8px 10px;color:#fff;font-size:13px;}
.rem:focus{outline:none;border-color:var(--accent);}
.rem::placeholder{color:#3d5078;}
.mnav{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--border);border-radius:10px;}
.mnav button{background:none;border:none;color:var(--muted);font-size:19px;padding:4px 12px;cursor:pointer;}
.mnav b{color:#fff;min-width:108px;text-align:center;font-size:14px;}
.noteline{font-size:11px;color:#f0a6ff;margin-top:4px;font-style:italic;overflow-wrap:anywhere;}
.search{width:100%;background:var(--field);border:1px solid var(--border);border-radius:10px;padding:11px 13px;color:#fff;font-size:14px;margin-bottom:10px;}
select.inl{background:var(--field);border:1px solid var(--border);color:#fff;border-radius:8px;padding:7px 8px;font-size:12px;max-width:100%;}
input[type=file]{display:none;}
code{background:var(--field);padding:1px 5px;border-radius:4px;font-size:11px;}
</style>
</head>
<body>
<div class="wrap">
<div id="top"></div>
<nav class="tabs" id="tabs"></nav>
<div class="content" id="main"></div>
</div>
<script src="../assets/cockpit.js"></script>
<script src="logic.js"></script>
<script>
(function(){
"use strict";
var C=window.Cockpit,F=window.FIN,AREA="finanzen";

function blank(){return {konten:{},rules:null,pmap:{},tmap:{},tx:[],deleted:[],imports:[]};}
function norm(d){d=d&&typeof d==="object"?d:blank();if(!d.konten)d.konten={};if(!Array.isArray(d.tx))d.tx=[];if(!Array.isArray(d.deleted))d.deleted=[];if(!Array.isArray(d.imports))d.imports=[];if(!Array.isArray(d.rules))d.rules=null;if(!d.pmap||typeof d.pmap!=="object")d.pmap={};if(!d.tmap||typeof d.tmap!=="object")d.tmap={};return d;}
function rules(){return data.rules||F.DEFAULT_RULES;}
function clone(x){return JSON.parse(JSON.stringify(x));}

/* Zwei Stände vereinen: Buchungen beider Geräte, gelöschte bleiben gelöscht */
function merge(l,r,lU,rU){
  l=norm(clone(l));r=norm(clone(r));var newer=lU>=rU?l:r,del={},by={},order=[];
  l.deleted.concat(r.deleted).forEach(function(id){del[id]=1;});
  r.tx.concat(l.tx).forEach(function(t){if(del[t.id])return;if(!by[t.id]){order.push(t.id);by[t.id]=t;return;}
    var a=by[t.id],o=Object.assign({},a);
    if((t.ct||0)>=(a.ct||0)){if(t.cat)o.cat=t.cat;else delete o.cat;if(t.ct)o.ct=t.ct;}
    if((t.nt||0)>=(a.nt||0)){if(t.note)o.note=t.note;else delete o.note;if(t.nt)o.nt=t.nt;}
    by[t.id]=o;});
  var imp={};r.imports.concat(l.imports).forEach(function(i){imp[i.ts+"|"+i.file]=i;});
  var out={konten:Object.assign({},lU>=rU?r.konten:l.konten,newer.konten),rules:newer.rules,pmap:Object.assign({},lU>=rU?r.pmap:l.pmap,newer.pmap),tmap:Object.assign({},lU>=rU?r.tmap:l.tmap,newer.tmap),
    tx:order.map(function(id){return by[id];}),deleted:Object.keys(del),imports:Object.keys(imp).map(function(k){return imp[k];}).sort(function(a,b){return a.ts-b.ts;}).slice(-50)};
  out._summary=summaryFor(out);return out;
}
C.registerMerge(AREA,merge);

var data=norm(C.getLocal(AREA,blank));
var thisYear=new Date().getFullYear();
var st={tab:"uebersicht",dm:null,dall:false,year:thisYear,ber:"alle",flash:null,q:"",fcat:"",fmon:"",sort:"datum",limit:80,edit:null,pending:null,pendingInfo:[]};
(function(){var ys=years();if(ys.length&&ys.indexOf(thisYear)<0)st.year=ys[ys.length-1];})();

function years(){var s={};data.tx.forEach(function(t){s[+t.d.slice(0,4)]=1;});return Object.keys(s).map(Number).sort();}
function kontenFilter(ber){if(ber==="alle")return null;var o={},any=false;Object.keys(data.konten).forEach(function(k){if(data.konten[k].bereich===ber){o[k]=1;any=true;}});return any?o:{__none:1};}
function summaryFor(d){
  if(!d.tx.length)return {k:"—",s:"Noch keine Buchungen"};
  F.setPartnerMap(d.pmap,d.tmap);var R=d.rules||F.DEFAULT_RULES,y=thisYear,has=d.tx.some(function(t){return t.d.slice(0,4)===String(y);});
  if(!has)y=+d.tx.reduce(function(m,t){return t.d>m?t.d:m;},"0000").slice(0,4);
  var r=F.report(d.tx,R,{year:y}),s=F.sum(r.ein)+F.sum(r.aus),mi=new Date().getMonth();
  var unk=d.tx.filter(function(t){return F.category(t,R)===F.UNKAT;}).length;
  return {k:(s>=0?"+":"−")+C.eur(Math.abs(s),0),s:"Saldo "+y+(y===thisYear?" · Ausgaben "+F.MON[mi]+" "+C.eur(Math.abs(r.aus[mi]),0):"")+(unk?" · "+unk+" offen":"")};
}
function persist(){data._summary=summaryFor(data);F.setPartnerMap(data.pmap,data.tmap);C.save(AREA,data);}
function flash(t,warn){st.flash={t:t,warn:!!warn};render();clearTimeout(flash.tm);flash.tm=setTimeout(function(){st.flash=null;render();},warn?4500:2600);}
function sEur(v,d){return '<span class="'+(v>=0?"pos":"neg")+'">'+(v>=0?"+":"−")+C.eur(Math.abs(v),d)+"</span>";}

/* ---------- Rahmen ---------- */
function render(){
  F.setPartnerMap(data.pmap,data.tmap);
  document.getElementById("top").innerHTML=C.topbar({title:"Finanzen",icon:"💶",sub:"ING · N26 · Privat & Geschäft",accent:"#e040fb",accent2:"#7c4dff"});
  C.paintStatus();
  var tabs=[["uebersicht","📊 Übersicht"],["monate","🗓 Monate"],["tage","📅 Tage"],["buchungen","📋 Buchungen"],["import","⬆ Import"],["regeln","⚙️ Regeln & Konten"]];
  document.getElementById("tabs").innerHTML=tabs.map(function(t){return '<button class="tab'+(st.tab===t[0]?" on":"")+'" onclick="F2.tab(\''+t[0]+'\')">'+t[1]+"</button>";}).join("");
  var h="";
  if(st.flash)h+='<div class="flash'+(st.flash.warn?" warn":"")+'">'+C.esc(st.flash.t)+"</div>";
  if(!data.tx.length&&st.tab!=="import"&&st.tab!=="regeln")h+='<div class="empty"><div class="big">💶</div>Noch keine Buchungen.<br><span class="small">Lade deine CSV-Exporte von ING und N26 hoch.</span><br><button class="btn" style="margin-top:14px" onclick="F2.tab(\'import\')">Zum Import</button></div>';
  else h+=({uebersicht:vDash,monate:vMatrix,tage:vDays,buchungen:vTx,import:vImport,regeln:vRules}[st.tab])();
  document.getElementById("main").innerHTML=h;
}
function filterBar(withBer){
  var ys=years();
  return '<div class="filt"><div class="yr"><button onclick="F2.yr(-1)" aria-label="Vorjahr">‹</button><b>'+st.year+'</b><button onclick="F2.yr(1)" aria-label="Folgejahr">›</button></div>'+
    (withBer===false?"":[["alle","Alle"],["privat","Privat"],["geschaeft","Geschäft"]].map(function(b){return '<button class="pill'+(st.ber===b[0]?" on":"")+'" onclick="F2.ber(\''+b[0]+'\')">'+b[1]+"</button>";}).join(""))+
    (ys.length&&ys.indexOf(st.year)<0?'<span class="small muted">keine Buchungen in '+st.year+"</span>":"")+"</div>";
}

/* ---------- Übersicht ---------- */
function vDash(){
  var R=rules(),rep=F.report(data.tx,R,{year:st.year,konten:kontenFilter(st.ber)});
  var E=F.sum(rep.ein),A=F.sum(rep.aus),S=E+A,N=F.sum(rep.neutral);
  var months=rep.aus.filter(function(v){return v!==0;}).length||1;
  var unk=(rep.matrix[F.UNKAT]||[]).length?data.tx.filter(function(t){return t.d.slice(0,4)===String(st.year)&&F.category(t,R)===F.UNKAT&&(!kontenFilter(st.ber)||kontenFilter(st.ber)[t.k]);}).length:0;
  var h=filterBar();
  h+='<div class="grid2" style="margin-bottom:14px">'+
    kpi("📥","Einnahmen",'<span class="pos">'+C.eur(E,0)+"</span>")+kpi("📤","Ausgaben",'<span class="neg">'+C.eur(Math.abs(A),0)+"</span>")+
    kpi("⚖️","Saldo "+st.year,sEur(S,0))+kpi("📆","Ø Ausgaben / Monat",C.eur(Math.abs(A)/months,0))+"</div>";
  if(N)h+='<div class="note" style="margin:-6px 0 14px">Umbuchungen und Sparen ('+C.eur(N,0)+') sind darin nicht enthalten, weil das Geld nur zwischen deinen Konten wandert.</div>';
  if(unk)h+='<div class="panel" style="border-color:#ff980066;cursor:pointer" onclick="F2.showUnk()"><b style="color:#ffb74d">⚠ '+unk+" Buchungen unkategorisiert</b><div class=\"note\">Tippen, um sie zuzuordnen – am schnellsten über „Als Regel merken“.</div></div>";
  var lab=F.MON.map(function(m){return m;});
  h+='<div class="panel"><h3>Saldo pro Monat</h3>'+C.barChart(lab.map(function(m,i){var v=rep.ein[i]+rep.aus[i];return {label:m,value:v,color:v>=0?"#00c853":"#ff5252"};}),{fmt:function(v){return C.eur(v,0);}})+"</div>";
  h+='<div class="panel"><h3>Einnahmen & Ausgaben pro Monat</h3>'+groupChart(F.MON,[{name:"Einnahmen",color:"#00c853",values:rep.ein},{name:"Ausgaben",color:"#e040fb",values:rep.aus}],function(v){return C.eur(v,0);})+"</div>";
  h+='<div class="panel"><h3 style="color:#00c853">Einnahmen nach Kategorie</h3>'+catBars(rep,R,1,"#00c853")+"</div>";
  h+='<div class="panel"><h3>Ausgaben nach Kategorie</h3>'+catBars(rep,R,-1,"#e040fb")+"</div>";
  var ks=Object.keys(data.konten).filter(function(k){return st.ber==="alle"||data.konten[k].bereich===st.ber;});
  if(ks.length)h+='<div class="panel"><h3>Konten</h3>'+ks.map(function(k){var ko=data.konten[k],n=data.tx.filter(function(t){return t.k===k;}).length;
    return '<div class="kv"><span>'+C.esc(ko.name)+' <span class="small">· '+(ko.bereich==="geschaeft"?"Geschäft":"Privat")+" · "+n+" Buchungen</span></span><span>"+(ko.saldo?"<b style=\"color:#fff\">"+C.eur(ko.saldo.v)+'</b> <span class="small">'+new Date(ko.saldo.d).toLocaleDateString("de-DE")+"</span>":'<span class="small">kein Kontostand</span>')+"</span></div>";}).join("")+
    '<div class="note" style="margin-top:6px">Kontostände liefert nur der ING-Export mit. N26 enthält keinen Saldo.</div></div>';
  return h;
}
function groupChart(labels,series,fmt){
  var W=340,H=200,pL=40,pR=10,pT=14,pB=32,n=labels.length,k=series.length;
  var mx=0;series.forEach(function(s){s.values.forEach(function(v){if(Math.abs(v)>mx)mx=Math.abs(v);});});
  if(!mx)return '<div class="note">Keine Werte im gewählten Zeitraum.</div>';
  mx*=1.12;var iW=W-pL-pR,iH=H-pT-pB,slot=iW/n,bw=Math.max(3,Math.min(14,slot*0.8/k));
  function y(v){return pT+iH*(1-v/mx);}
  var o='<svg viewBox="0 0 '+W+" "+H+'" width="100%" role="img">';
  for(var g=0;g<=3;g++){var gv=mx*g/3,gy=y(gv);o+='<line x1="'+pL+'" y1="'+gy+'" x2="'+(W-pR)+'" y2="'+gy+'" stroke="#1e2a4a" stroke-dasharray="3 3"/><text x="'+(pL-5)+'" y="'+(gy+3)+'" fill="#5c7aaa" font-size="9" text-anchor="end">'+C.int(gv)+"</text>";}
  labels.forEach(function(l,i){var cx=pL+slot*(i+.5),x0=cx-bw*k/2;
    series.forEach(function(s,j){var v=Math.abs(s.values[i]||0),yy=y(v);
      o+='<rect x="'+(x0+j*bw+.5)+'" y="'+yy+'" width="'+(bw-1)+'" height="'+Math.max(0,pT+iH-yy)+'" rx="2" fill="'+s.color+'"><title>'+C.esc(l+" – "+s.name+": "+fmt(v))+"</title></rect>";});
    o+='<text x="'+cx+'" y="'+(H-10)+'" fill="#5c7aaa" font-size="9" text-anchor="middle">'+C.esc(l)+"</text>";});
  return o+"</svg>"+'<div style="display:flex;gap:14px;font-size:11px;color:var(--muted);margin-top:4px">'+series.map(function(s){return '<span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:'+s.color+';margin-right:5px;vertical-align:middle"></i>'+C.esc(s.name)+"</span>";}).join("")+"</div>";
}
function catBars(rep,R,sign,color){
  var list=rep.cats.map(function(c){return {c:c,v:F.sum(rep.matrix[c])};}).filter(function(x){return (sign<0?x.v<0:x.v>0)&&!F.isNeutral(x.c,R);}).sort(function(a,b){return Math.abs(b.v)-Math.abs(a.v);});
  if(!list.length)return '<div class="note">Keine '+(sign<0?"Ausgaben":"Einnahmen")+" im gewählten Zeitraum.</div>";
  var mx=Math.abs(list[0].v),tot=list.reduce(function(s,x){return s+Math.abs(x.v);},0);
  return list.slice(0,12).map(function(x){return '<div class="bar" style="cursor:pointer" onclick="F2.cat(\''+C.esc(x.c).replace(/'/g,"\\'")+'\')"><span class="l">'+C.esc(x.c)+'</span><span class="t"><i style="width:'+(Math.abs(x.v)/mx*100).toFixed(1)+'%;background:'+(x.c===F.UNKAT?"#ff9800":color)+'"></i></span><span class="v">'+C.eur(Math.abs(x.v),0)+' <span class="small muted">'+C.num(Math.abs(x.v)/tot*100,0)+" %</span></span></div>";}).join("");
}
function kpi(i,l,v){return '<div class="kpi"><div class="ico">'+i+'</div><div class="val">'+v+'</div><div class="lab">'+l+"</div></div>";}

/* ---------- Monatsmatrix ---------- */
function vMatrix(){
  var R=rules(),rep=F.report(data.tx,R,{year:st.year,konten:kontenFilter(st.ber)});
  var h=filterBar();
  if(!rep.n)return h+'<div class="empty">Keine Buchungen in '+st.year+".</div>";
  function cell(v){return Math.abs(v)<0.005?'<td class="muted">–</td>':'<td class="'+(v<0?"neg":"pos")+'">'+C.num(v,0)+"</td>";}
  h+='<div class="panel" style="padding:10px"><div class="scroll-x"><table class="t mx"><thead><tr><th>Kategorie</th>'+F.MON.map(function(m){return "<th>"+m+"</th>";}).join("")+"<th>Jahr</th></tr></thead><tbody>";
  rep.cats.slice().sort(function(a,b){return (F.isNeutral(a,R)?1:0)-(F.isNeutral(b,R)?1:0);}).forEach(function(c){var v=rep.matrix[c],neu=F.isNeutral(c,R);h+='<tr><td class="'+(neu?"neutral":"")+'" onclick="F2.cat(\''+C.esc(c).replace(/'/g,"\\'")+'\')">'+C.esc(c)+(neu?" ↔":"")+"</td>"+v.map(cell).join("")+'<td class="'+(F.sum(v)<0?"neg":"pos")+'"><b>'+C.num(F.sum(v),0)+"</b></td></tr>";});
  var sal=rep.ein.map(function(v,i){return v+rep.aus[i];});
  [["Einnahmen",rep.ein],["Ausgaben",rep.aus],["Saldo",sal]].forEach(function(r){h+='<tr class="sum"><td>'+r[0]+"</td>"+r[1].map(cell).join("")+cell(F.sum(r[1])).replace("<td","<td style=\"font-weight:800\"")+"</tr>";});
  h+="</tbody></table></div></div><div class=\"note\">Beträge in €, gerundet. Tippe auf eine Kategorie, um ihre Buchungen zu sehen. ↔ = Umbuchung, zählt nicht zu Einnahmen/Ausgaben.</div>";
  return h;
}

/* ---------- Tagesansicht ---------- */
var WT=["So","Mo","Di","Mi","Do","Fr","Sa"];
function vDays(){
  var R=rules(),kf=kontenFilter(st.ber);
  if(!st.dm){var last=data.tx.reduce(function(m,t){return t.d>m?t.d:m;},"");var now=new Date().toISOString().slice(0,7);st.dm=last&&last.slice(0,7)<now?last.slice(0,7):now;}
  var y=+st.dm.slice(0,4),mo=+st.dm.slice(5,7)-1,dim=new Date(y,mo+1,0).getDate();
  var list=data.tx.filter(function(t){if(t.d.slice(0,7)!==st.dm)return false;if(kf&&!kf[t.k])return false;
    if(st.dall)return true;var c=F.category(t,R);return t.b<0&&!F.isNeutral(c,R);});
  list.sort(function(a,b){return b.d.localeCompare(a.d)||a.b-b.b;});
  var h='<div class="filt"><div class="mnav"><button onclick="F2.dmv(-1)" aria-label="Vormonat">‹</button><b>'+new Date(y,mo,1).toLocaleDateString("de-DE",{month:"long",year:"numeric"})+'</b><button onclick="F2.dmv(1)" aria-label="Folgemonat">›</button></div>'+
    [["alle","Alle"],["privat","Privat"],["geschaeft","Geschäft"]].map(function(b){return '<button class="pill'+(st.ber===b[0]?" on":"")+'" onclick="F2.ber(\''+b[0]+'\')">'+b[1]+"</button>";}).join("")+"</div>";
  h+='<div class="filt"><button class="pill'+(st.dall?"":" on")+'" onclick="F2.dall(false)">Nur Ausgaben</button><button class="pill'+(st.dall?" on":"")+'" onclick="F2.dall(true)">Alle Bewegungen</button></div>';
  /* Monatskennzahlen */
  var perDay=Array(dim).fill(0),out=0,inn=0;
  list.forEach(function(t){var d=+t.d.slice(8,10)-1;if(t.b<0){perDay[d]+=-t.b;out+=-t.b;}else inn+=t.b;});
  var days=perDay.filter(function(v){return v>0;}).length,maxI=perDay.indexOf(Math.max.apply(null,perDay));
  h+='<div class="grid2" style="margin-bottom:14px">'+kpi("📤","Ausgaben im Monat",'<span class="neg">'+C.eur(out,0)+"</span>")+
    kpi("📆","Tage mit Ausgaben",days+" von "+dim)+

/* ---------- Aktionen ---------- */
/* Kategorien, Zuordnungen und Regeln aus einem früheren Stand zurückholen – ergänzt nur, überschreibt nichts */
function restoreFrom(old){
  old=norm(clone(old));var byId={},n=0,p=0,r=0,now=Date.now();
  old.tx.forEach(function(t){byId[t.id]=t;});
  data.tx.forEach(function(t){var o=byId[t.id];if(!t.cat&&o&&o.cat){t.cat=o.cat;t.ct=now;n++;}if(!t.note&&o&&o.note){t.note=o.note;t.nt=now;n++;}});
  Object.keys(old.pmap).forEach(function(k){if(!data.pmap[k]){data.pmap[k]=old.pmap[k];p++;}});
  Object.keys(old.tmap).forEach(function(k){if(!data.tmap[k]){data.tmap[k]=old.tmap[k];p++;}});
  if(old.rules){ensureRules();old.rules.forEach(function(orl,i){var ex=data.rules.filter(function(x){return x.name===orl.name;})[0];
    if(!ex){data.rules.splice(Math.min(i,data.rules.length),0,clone(orl));r++;return;}
    orl.words.forEach(function(w){if(ex.words.indexOf(w)<0){ex.words.push(w);r++;}});if(orl.neutral&&!ex.neutral){ex.neutral=true;r++;}});}
  return {n:n,p:p,r:r};
}
function countCats(d){d=norm(clone(d));return d.tx.filter(function(t){return t.cat||t.note;}).length+Object.keys(d.pmap).length+Object.keys(d.tmap).length;}
function ensureRules(){if(!data.rules)data.rules=clone(F.DEFAULT_RULES);}
window.F2={
  tab:function(t){st.tab=t;st.edit=null;render();window.scrollTo(0,0);},
  yr:function(d){st.year+=d;st.limit=80;render();},
  ber:function(b){st.ber=b;render();},
  q:function(v){st.q=v;st.limit=80;render();var i=document.querySelector(".search");if(i){i.focus();i.setSelectionRange(v.length,v.length);}},
  fcat:function(v){st.fcat=v;st.limit=80;render();},
  fmon:function(v){st.fmon=v;st.limit=80;render();},
  sort:function(){st.sort=st.sort==="datum"?"betrag":"datum";render();},
  more:function(){st.limit+=80;render();},
  cat:function(c){st.fcat=c;st.fmon="";st.q="";st.tab="buchungen";st.sort="betrag";render();window.scrollTo(0,0);},
  showUnk:function(){F2.cat(F.UNKAT);},
  edit:function(id){st.edit=id;render();},
  setCat:function(id,c){data.tx.forEach(function(t){if(t.id===id){if(c)t.cat=c;else delete t.cat;t.ct=Date.now();}});persist();render();},
  learn:function(id){var t=data.tx.filter(function(x){return x.id===id;})[0];if(!t||!t.cat||!t.p)return;
    var k=F.partnerKey(t.p),c=t.cat;data.pmap[k]=c;
    /* manuelle Einzelzuordnungen desselben Empfängers sind jetzt überflüssig */
    data.tx.forEach(function(x){if(x.cat===c&&F.partnerKey(x.p)===k){delete x.cat;x.ct=Date.now();}});
    var n=data.tx.filter(function(x){return F.partnerKey(x.p)===k;}).length;
    st.edit=null;persist();flash("✓ Alle Buchungen von „"+t.p+"“ → "+c+(n>1?" ("+n+" Buchungen)":""));},
  learnType:function(id){var t=data.tx.filter(function(x){return x.id===id;})[0];if(!t||!t.cat)return;var k=F.typeKey(t.t);if(!k)return;
    var c=t.cat;data.tmap[k]=c;data.tx.forEach(function(x){if(x.cat===c&&!x.p&&F.partnerKey(x.t)===k){delete x.cat;x.ct=Date.now();}});
    var n=data.tx.filter(function(x){return !x.p&&F.partnerKey(x.t)===k;}).length;
    st.edit=null;persist();flash("✓ Alle Buchungen mit Buchungsart „"+t.t+"“ → "+c+(n>1?" ("+n+" Buchungen)":""));},
  rmT:function(k){delete data.tmap[k];persist();render();},
  files:function(inp){var fs=[].slice.call(inp.files||[]);inp.value="";if(!fs.length)return;
    var blocks=[],info=[];
    Promise.all(fs.map(function(f){return f.arrayBuffer().then(function(buf){var r=F.parseFile(buf,f.name);
      if(!r){info.push(f.name+": Format nicht erkannt (weder ING- noch N26-CSV).");return;}
      r.forEach(function(b){b.file=f.name;F.assignIds(b,b.key);blocks.push(b);});});})).then(function(){
      /* gleiche Konten aus mehreren Dateien zusammenfassen */
      var by={};blocks.forEach(function(b){if(by[b.key]){var seen={};by[b.key].txs.forEach(function(t){seen[t.id]=1;});b.txs.forEach(function(t){if(!seen[t.id])by[b.key].txs.push(t);});by[b.key].file+=", "+b.file;if(b.saldo&&(!by[b.key].saldo||b.saldo.d>by[b.key].saldo.d))by[b.key].saldo=b.saldo;}else by[b.key]=b;});
      st.pending=Object.keys(by).map(function(k){return by[k];});st.pendingInfo=info;
      if(!st.pending.length){st.pending=null;flash("⚠ "+(info[0]||"Keine Buchungen gefunden"),true);return;}
      render();});},
  commit:function(){var ids={};data.tx.forEach(function(t){ids[t.id]=1;});var del={};data.deleted.forEach(function(d){del[d]=1;});var total=0,dup=0;
    st.pending.forEach(function(b,i){var name=document.getElementById("pn"+i).value.trim()||b.name,ber=document.getElementById("pb"+i).value;
      var ko=data.konten[b.key]||{};ko.name=name;ko.bank=b.bank;ko.bereich=ber;if(b.saldo&&(!ko.saldo||b.saldo.d>=ko.saldo.d))ko.saldo=b.saldo;data.konten[b.key]=ko;
      var neu=0;b.txs.forEach(function(t){if(ids[t.id]){dup++;return;}if(del[t.id]){delete del[t.id];}ids[t.id]=1;data.tx.push(t);neu++;});total+=neu;
      data.imports.push({ts:Date.now(),file:b.file,konto:name,neu:neu,dup:b.txs.length-neu});});
    data.deleted=Object.keys(del);
    data.tx.sort(function(a,b){return a.d.localeCompare(b.d);});
    st.pending=null;persist();st.tab="uebersicht";var ys=years();if(ys.length)st.year=ys[ys.length-1];
    flash("✓ "+total+" neue Buchungen übernommen"+(dup?" · "+dup+" doppelte übersprungen":""));},
  cancel:function(){st.pending=null;render();},
  exp:function(){C.downloadText("finanzen-"+C.today()+".json",JSON.stringify(data))?flash("✓ Export gestartet"):flash("⚠ Download nicht möglich",true);},
  addKw:function(i){var el=document.getElementById("kw"+i),v=(el.value||"").trim().toLowerCase();if(!v)return;ensureRules();if(data.rules[i].words.indexOf(v)<0)data.rules[i].words.push(v);persist();render();},
  rmKw:function(i,j){ensureRules();data.rules[i].words.splice(j,1);persist();render();},
  mv:function(i,d){ensureRules();var j=i+d;if(j<0||j>=data.rules.length)return;var x=data.rules[i];data.rules[i]=data.rules[j];data.rules[j]=x;persist();render();},
  rmCat:function(i){ensureRules();if(!confirm("Kategorie „"+data.rules[i].name+"“ löschen? Buchungen werden dann neu zugeordnet."))return;var nm=data.rules[i].name;data.rules.splice(i,1);data.tx.forEach(function(t){if(t.cat===nm)delete t.cat;});persist();render();},
  neutral:function(i){ensureRules();data.rules[i].neutral=!data.rules[i].neutral;persist();render();},
  addCat:function(){var n=prompt("Name der neuen Kategorie:");if(!n||!n.trim())return;ensureRules();n=n.trim();if(data.rules.some(function(r){return r.name===n;})){flash("⚠ Gibt es schon",true);return;}data.rules.push({name:n,words:[]});persist();render();},
  resetRules:function(){if(!confirm("Alle Regeln auf den Standard zurücksetzen? Eigene Schlüsselwörter gehen verloren."))return;data.rules=null;persist();flash("✓ Standardregeln aktiv");},
  rulesImp:function(inp){var f=inp.files&&inp.files[0];inp.value="";if(!f)return;C.readFile(f).then(function(t){
    var o;try{o=JSON.parse(t);}catch(e){flash("⚠ Kein gültiges JSON",true);return;}
    var list=Array.isArray(o)?o:(o&&Array.isArray(o.rules)?o.rules:null);if(!list){flash("⚠ Keine Regeln erkannt",true);return;}
    ensureRules();var added=0;
    list.forEach(function(nr){if(!nr||!nr.name||!Array.isArray(nr.words))return;
      var ex=data.rules.filter(function(r){return r.name===nr.name;})[0];
      if(!ex){ex={name:nr.name,words:[]};var pos=0,m=/^nach:(.+)$/.exec(nr.position||"");
        if(m){data.rules.forEach(function(r,i){if(r.name===m[1])pos=i+1;});}
        data.rules.splice(pos,0,ex);}
      if(nr.neutral)ex.neutral=true;if(nr.onlyIn)ex.onlyIn=true;if(nr.onlyOut)ex.onlyOut=true;
      nr.words.forEach(function(w){w=String(w).toLowerCase().trim();if(w&&ex.words.indexOf(w)<0){ex.words.push(w);added++;}});});
    persist();flash("✓ "+added+" Schlüsselwörter übernommen");});},
  dmv:function(d){var y=+st.dm.slice(0,4),m=+st.dm.slice(5,7)-1+d;var dt=new Date(y,m,1);st.dm=dt.getFullYear()+"-"+("0"+(dt.getMonth()+1)).slice(-2);render();window.scrollTo(0,0);},
  dall:function(v){st.dall=v;render();},
  note:function(id,v){v=String(v||"").trim().slice(0,500);data.tx.forEach(function(t){if(t.id===id){if(v)t.note=v;else delete t.note;t.nt=Date.now();}});persist();C.paintStatus();},
  loadHist:function(){st.hist="loading";render();C.versions(AREA,40).then(function(v){st.hist=v;render();F2.checkAll();},function(e){st.hist={err:"Versionen konnten nicht geladen werden: "+e.message};render();});},
  checkAll:function(){ /* nacheinander prüfen, damit die API nicht überlastet wird */
    var i=0;(function next(){if(!Array.isArray(st.hist)||i>=st.hist.length)return;var k=i++;F2.checkVer(k).then(next,next);})();},
  checkVer:function(i){var v=st.hist[i];if(!v||v.count!=null)return Promise.resolve();
    return C.versionAt(AREA,v.sha).then(function(d){v.data=d;v.count=countCats(d);if(st.tab==="import")render();},function(){v.count=0;});},
  restore:function(i){var v=st.hist[i];if(!v||!v.data)return;var r=restoreFrom(v.data);persist();st.tab="uebersicht";
    flash("✓ Wiederhergestellt: "+r.n+" Kategorien, "+r.p+" Zuordnungen, "+r.r+" Regel-Ergänzungen");},
  restoreBackup:function(){var bk=C.getBackup(AREA);if(!bk)return;var r=restoreFrom(bk.rec.data);persist();st.tab="uebersicht";
    flash("✓ Wiederhergestellt: "+r.n+" Kategorien, "+r.p+" Zuordnungen, "+r.r+" Regel-Ergänzungen");},
  rmP:function(k){delete data.pmap[k];persist();render();},
  kname:function(k,v){if(data.konten[k]){data.konten[k].name=v.trim()||data.konten[k].name;persist();}},
  kber:function(k,v){if(data.konten[k]){data.konten[k].bereich=v;persist();render();}},
  kdel:function(k){var n=data.tx.filter(function(t){return t.k===k;}).length;if(!confirm("Alle "+n+" Buchungen von „"+data.konten[k].name+"“ löschen?"))return;
    data.tx.forEach(function(t){if(t.k===k)data.deleted.push(t.id);});data.tx=data.tx.filter(function(t){return t.k!==k;});delete data.konten[k];persist();render();flash("✓ Gelöscht");}
};

render();
C.autoPull([AREA],function(a,d){data=norm(d);render();});
})();
</script>
