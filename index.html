<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0e1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Cockpit</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="stylesheet" href="assets/style.css">
<style>
#heute{padding:12px 16px 0;}
.hp{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:14px 16px;}
.hp h2{margin:0 0 8px;font-size:14px;color:#fde68a;font-weight:700;display:flex;justify-content:space-between;align-items:baseline;}
.hp h2 span{font-size:11px;color:var(--muted);font-weight:400;}
.hi{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid #152038;text-decoration:none;color:inherit;}
.hi:first-of-type{border-top:none;}
.hi .ic{font-size:17px;line-height:1.2;flex:0 0 22px;text-align:center;}
.hi .tx{flex:1;min-width:0;}
.hi .tx b{display:block;color:#fff;font-size:13px;font-weight:600;overflow-wrap:anywhere;}
.hi .tx span{display:block;font-size:11px;color:var(--muted);margin-top:2px;}
.hi .go{color:var(--muted);font-size:16px;align-self:center;}
.hi.rot .tx span{color:#f87171;}
.hp .leer{font-size:13px;color:#4ade80;padding:4px 0;}
.hi .mh{flex:0 0 22px;height:22px;border-radius:50%;border:2px solid #facc15;background:transparent;color:transparent;font-size:12px;font-weight:800;cursor:pointer;padding:0;margin-top:1px;}
.hi .mh:hover,.hi .mh.ok{background:#22c55e;border-color:#22c55e;color:#04160a;}
.hp .mehr{display:block;text-align:center;font-size:12px;color:var(--muted);margin-top:6px;cursor:pointer;background:none;border:none;width:100%;}
</style>
</head>
<body>
<div class="wrap">
  <header class="topbar" style="border-bottom:none">
    <div class="ttl"><b>🧭 Cockpit</b><span>Markus · Übersicht</span></div>
    <div class="right" id="hubRight"><a id="cp-sync" class="sync" href="einstellungen.html"><i></i></a>
      <a class="home" href="einstellungen.html" aria-label="Einstellungen">⚙</a></div>
  </header>
  <div class="hero"><h1 id="greet">Hallo Markus</h1><p id="sub">Alle Bereiche auf einen Blick</p></div>
  <div id="setupHint"></div>
  <div id="heute"></div>
  <nav class="tiles" id="tiles"></nav>
  <div class="content" id="extra"></div>
</div>
<script src="assets/cockpit.js"></script>
<script src="finanzen/logic.js"></script>
<script src="vertraege/logic.js"></script>
<script src="steuer/logic.js"></script>
<script src="zaehler/logic.js"></script>
<script src="auto/logic.js"></script>
<script src="dokumente/logic.js"></script>
<script src="memo/logic.js"></script>
<script>
(function(){
"use strict";
var C=window.Cockpit;

/* Standard-Reihenfolge nach Nutzung; eigene Reihenfolge je Gerät unter Einstellungen → Kacheln (C.kacheln) */
var AREAS=[
  {id:"dokumente",name:"Dokumente",icon:"📂",color:"#38bdf8",href:"dokumente/index.html"},
  {id:"finanzen",name:"Finanzen",icon:"💶",color:"var(--c-finanzen)",href:"finanzen/index.html"},
  {id:"ferienwohnung",name:"Ferienwohnung",icon:"🏡",color:"#2dd4bf",href:"ferienwohnung/index.html"},
  {id:"vertraege",name:"Verträge & Fristen",icon:"📑",color:"#f59e0b",href:"vertraege/index.html"},
  {id:"memo",name:"Memo & Einkauf",icon:"📝",color:"#facc15",href:"memo/index.html"},
  {id:"haus",name:"Haus",icon:"🏘️",color:"#fb923c",href:"haus/index.html"},
  {id:"energie",name:"Energie",icon:"🏠",color:"var(--c-energie)",href:"energie/index.html"},
  {id:"auto",name:"Auto",icon:"🚗",color:"var(--c-auto)",href:"auto/index.html"},
  {id:"steuer",name:"Steuer",icon:"🧾",color:"#a78bfa",href:"steuer/index.html"},
  {id:"edelmetall",name:"Edelmetalle",icon:"🪙",color:"var(--c-edelmetall)",href:"edelmetall/index.html"},
  {id:"training",name:"Training",icon:"🏋️",color:"#f43f5e",href:"training/index.html"},
  {id:"zaehler",name:"ThingCounter",icon:"🎯",color:"#14b8a6",href:"zaehler/index.html"}
];

/* Kurz-Kennzahl je Bereich; Bereiche liefern ihre Zusammenfassung selbst mit (data._summary) */
function summary(area){
  var d=C.getLocal(area.id,null);
  if(area.id==="auto"&&d)return autoSummary(d);
  if(area.id==="vertraege"&&d&&window.VERTR)return VERTR.summary(d,C.getLocal("haus",null),C.getLocal("auto",null));
  if(area.id==="memo"&&d&&window.MEMO)return MEMO.summary(d);
  if(area.id==="zaehler"&&d&&window.ZAEHLER)return ZAEHLER.summary(d,Date.now()); /* bewusst ohne Namen */
  if(d&&d._summary)return d._summary;
  return {k:"—",s:d?"Daten vorhanden":"Noch keine Daten"};
}
function autoSummary(d){
  var totKm=0,totCost=0,nx=null;try{nx=window.AUTO?AUTO.naechster(d,V.heute()):null;}catch(x){}
  (window.AUTO?AUTO.IDS:["corsa","volvo"]).forEach(function(k){var c=d[k];if(!c||!c.entries||!c.entries.length)return;
    var e=c.entries,start=c.startOdo!=null?c.startOdo:e[0].odo;totKm+=e[e.length-1].odo-start;
    e.forEach(function(x){if(x.price!=null)totCost+=x.fill*x.price;});});
  var tx=nx?"🔧 "+nx.titel.replace(/^([^:]+): /,"$1 ")+" "+V.wann(nx.tage):null;
  if(!totKm)return {k:"—",s:tx||"Noch keine Fahrten"};
  return {k:C.int(totKm)+" km",s:tx||"Kosten "+C.eur(totCost,0)};
}

/* ---------- Heute & demnächst: was aus allen Bereichen ansteht ---------- */
var V=window.VERTR,offenAlle=false;
C.registerMerge("vertraege",V.merge);
if(window.DOKS)C.registerMerge("dokumente",DOKS.dokMerge); /* PC-Abgleich: Eingang, Hausmeister, Zählerfotos */
function heuteListe(){
  var t=V.heute(),out=[];
  function add(ic,txt,sub,prio,href,rot,memo){out.push({ic:ic,txt:txt,sub:sub,prio:prio,href:href,rot:!!rot,memo:memo||null});}
  /* Memo & Einkaufsliste: offene Notizen einzeln (abhakbar), Einkaufsliste als ein Punkt */
  if(window.MEMO){try{MEMO.heute(C.getLocal("memo",null),t).forEach(function(e){add(e.ic,e.txt,e.sub,e.prio,e.href,e.rot,e.haken?e.id:null);});}catch(x){}}
  /* Fristen, Kündigungstermine, Nebenkostenabrechnungen */
  var vt=C.getLocal("vertraege",null),fin=C.getLocal("finanzen",null),fixL=null,belegt={};
  /* Preiserhöhungen bei Verträgen festhalten (Termin „Sonderkündigung prüfen“, auch für die Wochenvorschau) */
  if(vt&&fin&&Array.isArray(fin.tx)&&window.FIN){try{FIN.setPartnerMap(fin.pmap,fin.tmap,fin.zmap);fixL=FIN.fixkosten(fin).list;vt=V.norm(vt);
    if(V.preisSync(vt,fixL,t)){vt._summary=V.summary(vt,C.getLocal("haus",null));C.save("vertraege",vt);}
    V.aktiv(vt.vertraege).forEach(function(v){var p=vt.preis[v.id];if(p&&v.fixKey&&V.preisRelevant(v))belegt[v.fixKey+"|"+p.d]=1;});}catch(x){}}
  try{V.termine(vt,{haus:C.getLocal("haus",null),kfz:C.getLocal("auto",null),t:t}).forEach(function(e){if(!e.faellig)return;
    add(e.typ==="kuendigung"?"✂️":e.typ==="auto"?"🏘️":e.typ==="preis"?"📈":e.typ==="kfz"?"🚗":"📌",e.titel,V.wann(e.tage)+" · "+V.de(e.datum)+(e.typ==="kuendigung"&&e.ende?" (zum "+V.de(e.ende)+")":"")+(e.typ==="kfz"&&e.info?" · "+e.info:""),e.tage,e.href,e.tage<0);});}catch(x){}
  /* Bescheinigungen des Vorjahres (Februar bis Mai), je steuerlich markiertem Vertrag */
  var bJ=window.STEUER?STEUER.besFenster(t):null;
  if(bJ){try{var sd=C.getLocal("steuer",null)||{},dk=C.getLocal("dokumente",null);
    var fe=STEUER.erwartet(bJ,{vt:vt,VT:V,idx:dk&&Array.isArray(dk.index)?dk.index:[],over:(sd.einst&&sd.einst.docJahr)||{}},sd).filter(function(x){return !x.ok;});
    if(fe.length)add("📄","Bescheinigungen "+bJ+" fehlen noch",fe.map(function(x){return String(x.v.name||"Vertrag").split(/\s+/).slice(0,2).join(" ");}).join(", ")+" – einscannen und ablegen",11,"steuer/index.html#belege");}catch(x){}}
  /* Ferienwohnung: An- und Abreisen der nächsten Tage (ohne Gästenamen) */
  var fw=C.getLocal("ferienwohnung",null);
  if(fw&&fw.bookings)Object.keys(fw.bookings).forEach(function(k){var b=fw.bookings[k];if(!b||b.cancelled||b.blocked||!b.arr)return;
    var na=V.tage(t,b.arr),nd=b.dep?V.tage(t,b.dep):99,g=(+b.adults||0)+(+b.children||0),n=b.dep?V.tage(b.arr,b.dep):0;
    if(na>=0&&na<=3)add("🧳","Anreise "+(na===0?"heute":na===1?"morgen":V.deKurz(b.arr)),(g?g+" Gäste · ":"")+n+" Nächte",na,"ferienwohnung/index.html");
    if(nd>=0&&nd<=1)add("🧹","Abreise "+(nd===0?"heute":"morgen")+" – Reinigung",V.deKurz(b.dep),nd,"ferienwohnung/index.html");});
  /* Dokumente im Eingang (Stand des letzten Abgleichs am PC) */
  var dok=C.getLocal("dokumente",null);
  /* Kontoauszüge im Eingang: der jüngere Stand zählt – Dokumente zählt sie, Finanzen übernimmt sie */
  var finE=C.getLocal("finanzen",null),ke=finE&&finE.kontoEingang,kc=dok&&dok.kontoCsv>0?dok.kontoCsv:0;
  if(ke&&ke.ts&&ke.ts>=((dok&&dok.upd)||0))kc=ke.n||0;
  else if(kc&&finE&&Array.isArray(finE.imports)&&dok.upd){var nach={};finE.imports.forEach(function(i){if(i&&i.auto&&i.ts>dok.upd)nach[i.file]=1;});kc=Math.max(0,kc-Object.keys(nach).length);}
  if(kc>0)add("🏦",kc+(kc===1?" Kontoauszug":" Kontoauszüge")+" im Eingang","am PC Finanzen öffnen – wird automatisch übernommen",5,"finanzen/index.html#import");
  if(dok&&dok.eingang>0)add("📥",dok.eingang+(dok.eingang===1?" Dokument":" Dokumente")+" im Eingang","am PC unter Dokumente prüfen und ablegen",6,"dokumente/index.html");
  /* Heizung der Ferienwohnung nach Belegung (Heizperiode) */
  try{V.heizHinweise(fw,C.getLocal("haus",null),t,-1,0).forEach(function(e){add("🌡️",e.titel,e.info,e.tage<0?0:1,e.href,e.tage<0);});}catch(x){}
  if(window.DOKS&&dok){try{
    /* Zählerstände aus Fotos (Hausmeister am PC) */
    var zo=DOKS.zstOffen(dok,C.getLocal("energie",null)).length;
    if(zo)add("📷",zo+(zo===1?" Zählerstand":" Zählerstände")+" aus Fotos übernehmen","in Energie kurz prüfen – ein Tipp genügt",6.5,"energie/index.html#fotos");
    /* Zahlungsüberwachung: fällige Rechnungen ohne Abbuchung */
    var op0=DOKS.offenePosten(dok.index,fin,C.getLocal("zuordnung",null),t),op=op0.filter(function(x){return !x.wv;});
    var kurz=function(e){return String(e.absender||e.betreff||"Rechnung").replace(/_/g," ").split(/\s+/).slice(0,2).join(" ");}; /* ohne Betreff – kann Persönliches enthalten */
    if(op.length===1)add("⏰","Rechnung offen? "+kurz(op[0].e),C.eur(op[0].b)+" · fällig seit "+V.de(op[0].e.faellig)+" – keine Abbuchung gefunden",7,"dokumente/index.html#offen",true);
    op0.filter(function(x){return x.wv;}).forEach(function(x){add("⚖️","Widerspruch "+kurz(x.e)+": Stand prüfen","Wiedervorlage "+V.de(x.wv.wv)+" – erledigt oder weiter beobachten",7.5,"dokumente/index.html#offen");});
    if(op.length>1)add("⏰",op.length+" Rechnungen offen?",op.slice(0,3).map(function(x){return kurz(x.e);}).join(", ")+" – keine Abbuchung gefunden",7,"dokumente/index.html#offen",true);
    /* Hausmeister und Sicherung (Stand des letzten Abgleichs am PC) */
    var hm=dok.hm,ref=dok.upd?Math.min(Date.now(),dok.upd):Date.now();
    if(hm){
      if(hm.ziel){var alt=hm.sOk?Math.floor((ref-Date.parse(hm.sOk))/864e5):null,gr=Math.max(14,(+hm.tage||7)*2);
        if(alt==null||alt>gr)add("💾",alt==null?"Sicherung der Ablage noch nie gelaufen":"Sicherung der Ablage seit "+alt+" Tagen nicht gelaufen",hm.sFehler||"Laufwerk anschließen – der Hausmeister holt es nach",8,"dokumente/index.html",true);}
      if(hm.lauf&&dok.upd&&dok.upd-Date.parse(hm.lauf)>3*864e5)add("🤖","Hausmeister lief seit "+V.de(hm.lauf)+" nicht mehr","Aufgabe in Windows eingerichtet? Dokumente → Einrichtung",8.5,"dokumente/index.html");
      if(hm.fotos)add("📷",hm.fotos+(hm.fotos===1?" Foto":" Fotos")+" ohne lesbaren Zählerstand","liegen im Eingang – neu fotografieren oder löschen",13,"dokumente/index.html");
      if(hm.auto)add("🤖",hm.auto+(hm.auto===1?" Brief":" Briefe")+" automatisch abgelegt","bekannte Absender, letzte 7 Tage – kurz drüberschauen",14,"dokumente/index.html");}
  }catch(x){}}
  /* Finanzen: veraltete Buchungen, fehlende Kategorien, Preiserhöhungen */
  if(fin&&Array.isArray(fin.tx)&&fin.tx.length&&window.FIN){try{
    var R=fin.rules||FIN.DEFAULT_RULES;FIN.setPartnerMap(fin.pmap,fin.tmap,fin.zmap);
    var neu=fin.tx.reduce(function(m,x){return x.d>m?x.d:m;},"0000"),alt=V.tage(neu,t);
    if(alt>14)add("🏦","Kontoauszüge holen","neueste Buchung vom "+V.de(neu)+" ("+alt+" Tage alt)",9,"finanzen/index.html#import");
    /* einzelne Konten, die beim letzten Import nicht dabei waren – Geschäftskonto zuerst */
    else FIN.importLuecken(fin,t).forEach(function(x){add("🏦","Kontoauszug fehlt: "+x.name,"Stand "+V.de(x.stand)+" – beim letzten Import nicht dabei"+(x.ber==="geschaeft"?" · Geschäftskonto":""),x.ber==="geschaeft"?8:9,"finanzen/index.html#import");});
    var ab=V.plusT(t,-90),unk=fin.tx.filter(function(x){return x.d>=ab&&FIN.category(x,R)===FIN.UNKAT;}).length;
    if(unk)add("🏷️",unk+" Buchungen ohne Kategorie","letzte 90 Tage – einmal zuordnen",12,"finanzen/index.html#unkat");
    var seit=V.plusT(t,-45);
    (fixL||FIN.fixkosten(fin).list).forEach(function(x){if(x.status!=="ok"||!x.active||!x.change||x.change.to<=x.change.from||x.change.d<seit)return;
      if(belegt[x.key+"|"+x.change.d])return; /* steht schon als Termin „Sonderkündigung prüfen“ drin */
      var wechsel=/versicher|energie|strom|gas|telekom|telefon|internet|mobilfunk|abo|stream/i.test((x.grp||"")+" "+(x.cat||""));
      add("📈","Teurer: "+x.name,C.eur(x.change.from)+" → "+C.eur(x.change.to)+" seit "+V.de(x.change.d)+(wechsel?" – Wechsel prüfen?":""),10,"vertraege/index.html#vertraege");});
  }catch(x){}}
  return out.sort(function(a,b){return a.prio-b.prio;});
}
function heuteHtml(){var l=heuteListe(),max=offenAlle?99:6;
  var h='<div class="hp"><h2>📌 Heute & demnächst'+(l.length?"<span>"+l.length+" Punkt"+(l.length===1?"":"e")+"</span>":"")+"</h2>";
  if(!l.length)return h+'<div class="leer">✓ Nichts Dringendes – alles erledigt.</div></div>';
  h+=l.slice(0,max).map(function(e){return '<a class="hi'+(e.rot?" rot":"")+'" href="'+C.esc(e.href)+'">'+(e.memo?'<button class="mh" data-memo="'+C.esc(e.memo)+'" aria-label="erledigt">✓</button>':'<div class="ic">'+e.ic+'</div>')+'<div class="tx"><b>'+C.esc(e.txt)+"</b><span>"+C.esc(e.sub)+'</span></div><div class="go">›</div></a>';}).join("");
  if(l.length>max)h+='<button class="mehr" onclick="window.__heuteAlle()">+ '+(l.length-max)+" weitere anzeigen</button>";
  return h+"</div>";}
window.__heuteAlle=function(){offenAlle=true;render();};
/* Memo direkt auf der Startseite abhaken */
document.getElementById("heute").addEventListener("click",function(e){var b=e.target.closest&&e.target.closest("button.mh");if(!b||!window.MEMO)return;
  e.preventDefault();e.stopPropagation();var d=MEMO.norm(C.getLocal("memo",MEMO.blank));MEMO.abhaken(d,b.getAttribute("data-memo"));d._summary=MEMO.summary(d);
  b.classList.add("ok");setTimeout(function(){C.save("memo",d);render();},350);});

function render(){
  try{document.getElementById("heute").innerHTML=heuteHtml();}catch(e){document.getElementById("heute").innerHTML="";}
  var h=new Date().getHours();
  document.getElementById("greet").textContent=(h<11?"Guten Morgen":h<18?"Hallo":"Guten Abend")+", Markus";
  document.getElementById("sub").textContent=new Date().toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  document.getElementById("tiles").innerHTML=C.kacheln(AREAS).map(function(a){var s=summary(a);
    return '<a class="tile" href="'+a.href+'" data-k="'+a.id+'" style="--tc:'+a.color+'"><div class="ic">'+a.icon+'</div><div class="nm">'+a.name+'</div><div class="k">'+C.esc(C.maskText(s.k))+'</div><div class="s">'+C.esc(C.maskText(s.s))+'</div></a>';}).join("");
  document.getElementById("setupHint").innerHTML=C.configured()?"":
    '<div class="content" style="padding-bottom:0"><div class="panel" style="border-color:#00bcd455"><b style="color:#00bcd4">☁ Sync noch nicht eingerichtet</b><div class="small muted" style="margin:6px 0 12px">Deine Daten liegen bisher nur auf diesem Gerät. Einmal einrichten, dann sind sie überall gleich.</div><a class="btn" style="background:#00bcd4;text-decoration:none;display:inline-block" href="einstellungen.html">Jetzt einrichten</a></div></div>';
  C.paintStatus();
}

document.getElementById('hubRight').insertAdjacentHTML('afterbegin',C.eyeButton());
window.addEventListener('cockpit:priv',render);
render();
/* Kachel-Nutzung zählen (für „nach Nutzung sortieren“) */
document.getElementById("tiles").addEventListener("click",function(e){var a=e.target.closest&&e.target.closest("a.tile");if(a&&a.dataset.k)C.kachelKlick(a.dataset.k);});
C.autoPull(AREAS.map(function(a){return a.id;}).concat(["zuordnung"]),render);
/* am PC mit verbundenem Ablage-Ordner: Eingang, Hausmeister und Zählerfotos frisch lesen */
function pc(){if(window.DOKS&&DOKS.supported())DOKS.pcAbgleich(C).then(function(ch){if(ch)render();});}
pc();document.addEventListener("visibilitychange",function(){if(!document.hidden)pc();});
})();
</script>
</body>
</html>
