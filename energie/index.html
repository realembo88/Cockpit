<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0e1a">
<title>Cockpit · Energie</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/style.css">
<style>
/* Energie-Bereich – dunkle Variante des bisherigen Dashboards */
.ea{padding:14px 16px;}
.yrbar{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
.eyrw{display:flex;align-items:center;gap:5px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:4px 8px;}
.eyrb{background:none;border:none;color:var(--muted);cursor:pointer;font-size:20px;padding:0 10px;line-height:1;}
.eyrv{font-size:15px;font-weight:700;min-width:48px;text-align:center;color:#fff;font-variant-numeric:tabular-nums;}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:10px;font-size:13px;cursor:pointer;border:1px solid var(--border);background:var(--panel);color:var(--text);font-weight:500;}
.btn-pri{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700;}
.btn-sm{padding:6px 10px;font-size:12px;}
.btn-add{background:transparent;border-color:#00c85366;color:#00c853;}
.btn-del{background:none;border:none;color:#ff5252;cursor:pointer;font-size:15px;padding:2px 6px;}
.section{margin-bottom:18px;}
.sec-h{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.esg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px;}
.esc{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:12px 14px;min-width:0;}
.esc-l{font-size:11px;color:var(--muted);margin-bottom:5px;display:flex;align-items:center;gap:6px;}
.esc-v{font-size:18px;font-weight:700;line-height:1.15;color:#fff;overflow-wrap:anywhere;font-variant-numeric:tabular-nums;}
.esc-s{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.5;}
.esc-tot{background:linear-gradient(135deg,#00c85333,var(--panel));border-color:#00c85366;}
.esc-tot .esc-v{color:#00e676;}
.cg{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:10px;}
.ecw{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px;min-width:0;}
.ecw-t{font-size:12px;color:var(--text);margin-bottom:10px;font-weight:600;display:flex;align-items:center;gap:7px;justify-content:space-between;flex-wrap:wrap;}
.ecw-t span{display:flex;align-items:center;gap:7px;}
.eleg{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:8px;font-size:11px;color:var(--muted);}
.eli{display:flex;align-items:center;gap:4px;}
.els{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
.ch-big{grid-column:1/-1;}
.ch-big .canvas-wrap{height:240px;}
.canvas-wrap{position:relative;height:180px;}
.edot{width:8px;height:8px;border-radius:50%;flex-shrink:0;display:inline-block;vertical-align:middle;}
.ecard{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px;}
.ecard-t{font-size:14px;font-weight:700;color:#fff;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;}
input[type=number],input[type=month]{background:var(--field);border:1px solid var(--border);color:#fff;padding:7px 8px;border-radius:8px;text-align:right;font-size:13px;-moz-appearance:textfield;font-variant-numeric:tabular-nums;}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;}
input[type=number]:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px #00c85333;}
.etw{overflow-x:auto;margin:0 -4px;}
.ecard table{width:100%;border-collapse:collapse;font-size:12px;}
.ecard th{background:var(--panel2);color:var(--muted);padding:8px 10px;text-align:right;font-weight:600;font-size:11px;border-bottom:1px solid var(--border);white-space:nowrap;}
.ecard th:first-child{text-align:left;position:sticky;left:0;z-index:1;}
.ecard td{padding:6px 10px;text-align:right;border-bottom:1px solid #152038;font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--text);}
.ecard td:first-child{text-align:left;color:var(--muted);position:sticky;left:0;background:var(--panel);z-index:1;}
.etot td{background:var(--panel2);font-weight:700;border-top:1px solid var(--border);color:#fff;}
.etot td:first-child{background:var(--panel2);color:#fff;}
.evm{color:#34466b!important;}
.ecard td.est{color:#ffcc80!important;font-style:italic;}
.ecard td.est::before{content:"≈ ";}
.estnote{font-size:11px;color:#ffcc80;margin:-4px 0 12px;font-style:italic;}
.einits{display:flex;flex-wrap:wrap;gap:12px;background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin-bottom:14px;align-items:center;}
.eil{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em;}
.eif{display:flex;align-items:center;gap:6px;}
.eif label{font-size:12px;color:var(--text);white-space:nowrap;}
.epunit{font-size:11px;color:var(--muted);white-space:nowrap;}
.tariff-table{margin-bottom:12px;}
.tariff-table td{padding:5px 6px;}
.tariff-table td input{width:86px;}
.tariff-from{display:flex;gap:4px;}
.tariff-from select{background:var(--field);border:1px solid var(--border);color:#fff;padding:7px 6px;border-radius:8px;font-size:12px;}
.tariff-block{background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:12px;}
.tariff-block .ecard td:first-child,.tariff-block td:first-child{background:var(--panel2);}
.tariff-block-t{font-size:13px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px;justify-content:space-between;color:#fff;}
.tariff-block-t>span{display:flex;align-items:center;gap:8px;}
.tariff-empty{padding:12px;text-align:center!important;color:var(--muted);font-size:12px;border:1px dashed var(--border);border-radius:8px;}
.tariff-info{font-size:12px;color:#b9c8e6;background:#0f2140;border:1px solid #1e3a6e;border-radius:10px;padding:11px 13px;margin-bottom:14px;line-height:1.55;}
.estabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
.estab{padding:7px 12px;border:1px solid var(--border);background:var(--panel2);color:var(--muted);cursor:pointer;border-radius:9px;font-size:12px;}
.estab.act{color:#fff;border-color:var(--accent);font-weight:600;background:#00c85322;}
.efn{font-size:11px;color:var(--muted);margin-top:12px;padding-top:10px;border-top:1px solid var(--border);line-height:1.6;}
.badge{padding:2px 7px;border-radius:8px;font-size:10px;font-weight:700;}
.bup{background:#ff525226;color:#ff8a80;}
.bdn{background:#00c85326;color:#69f0ae;}
.bnt{background:#ffffff14;color:var(--muted);}
.esmsg{font-size:12px;color:#00e676;opacity:0;transition:opacity .3s;}
.esmsg.vis{opacity:1;}
.tabs .edot{margin-right:2px;}
code{background:var(--field);padding:1px 5px;border-radius:4px;font-size:11px;}
input[type=file]{display:none;}
@media (min-width:900px){.wrap.wide{max-width:1200px;}}
</style>
</head>
<body>
<div class="wrap wide">
<div id="top"></div>
<nav class="tabs" id="tabs"></nav>
<div class="ea" id="eapp"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="../assets/cockpit.js"></script>
<script src="../assets/wallbox.js"></script>
<script>
document.getElementById("top").innerHTML=Cockpit.topbar({title:"Energie",icon:"🏠",sub:"Gas · Wasser · Strom · PV",accent:"#00c853",accent2:"#22b8cf"});
Cockpit.paintStatus();

const MO=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
const STORE_KEY='energie_app_v2';
const STORE_KEY_V1='energie_app_v1';

const TARIFFS={
  gas:[
    {key:'ap',label:'Arbeitspreis',unit:'ct/kWh',step:'0.001'},
    {key:'gp',label:'Grundpreis',unit:'€/Monat',step:'0.01'},
    {key:'bw',label:'Brennwert',unit:'kWh/m³',step:'0.001'}
  ],
  wasser:[
    {key:'wap',label:'Wasser',unit:'€/m³',step:'0.01'},
    {key:'awap',label:'Abwasser',unit:'€/m³',step:'0.01'},
    {key:'gp',label:'Grundpreis',unit:'€/Monat',step:'0.01'}
  ],
  strom:[
    {key:'ap',label:'Bezug',unit:'ct/kWh',step:'0.01'},
    {key:'ep',label:'Einspeisung',unit:'ct/kWh',step:'0.01'},
    {key:'gp',label:'Grundpreis',unit:'€/Monat',step:'0.01'}
  ]
};
const TARIFF_NAMES={gas:'Gas',wasser:'Wasser / Abwasser',strom:'Strom'};
const TARIFF_DOTS={gas:'#F97316',wasser:'#38BDF8',strom:'#FACC15'};

const S={
  wb:{sessions:[]},year:(function(){try{var y=parseInt(localStorage.getItem('cockpit:energie:year'),10);return isNaN(y)?new Date().getFullYear():y;}catch(e){return new Date().getFullYear();}})(),tab:'preise',st:'haupt',dirty:false,lastSaved:null,
  tariffs:{gas:[],wasser:[],strom:[]},
  fixed:{gas_z:'0.95'},
  data:{}
};

function yd(y){
  if(!S.data[y])S.data[y]={gas_s:'',w_s:'',stb_s:'',ste_s:'',stdg_s:'',stug_s:'',
    m:Array.from({length:12},()=>({g:'',w:'',sb:'',se:'',sev:'',sdg:'',sug:'',pe:'',pas:'',pis:''}))};
  /* Migration: alte Daten ohne PV-Felder erweitern */
  if(S.data[y].m)S.data[y].m.forEach(m=>{
    if(m.pe===undefined)m.pe='';
    if(m.pas===undefined)m.pas='';
    if(m.pis===undefined)m.pis='';
  });
  return S.data[y];
}

const ym=(y,m)=>String(y)+'-'+String(m+1).padStart(2,'0');
function tariffAt(kind,y,m){
  const list=S.tariffs[kind];if(!list||!list.length)return null;
  const key=ym(y,m);
  const sorted=[...list].sort((a,b)=>a.from.localeCompare(b.from));
  let active=null;
  for(const t of sorted){if(t.from<=key)active=t;else break;}
  return active;
}
function addTariff(kind){
  const today=new Date();
  const from=`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}`;
  const last=S.tariffs[kind].length?[...S.tariffs[kind]].sort((a,b)=>a.from.localeCompare(b.from)).slice(-1)[0]:null;
  const t={from};
  TARIFFS[kind].forEach(f=>t[f.key]=last?last[f.key]:'');
  S.tariffs[kind].push(t);
  S.tariffs[kind].sort((a,b)=>a.from.localeCompare(b.from));
  scheduleSave();rApp();
}
function delTariff(kind,idx){
  if(!confirm('Diese Tarifperiode löschen?'))return;
  S.tariffs[kind].splice(idx,1);
  scheduleSave();rApp();
}
function updTariff(kind,idx,field,val){
  if(!S.tariffs[kind][idx])return;
  S.tariffs[kind][idx][field]=val;
  scheduleSave();
}
function updTariffFrom(kind,idx,val){
  if(!S.tariffs[kind][idx])return;
  S.tariffs[kind][idx].from=val;
  S.tariffs[kind].sort((a,b)=>a.from.localeCompare(b.from));
  scheduleSave();rApp();
}
function updTariffFromPart(kind,idx,part,val){
  if(!S.tariffs[kind][idx])return;
  const cur=S.tariffs[kind][idx].from||(new Date().getFullYear()+'-01');
  let[y,m]=cur.split('-');
  if(part==='y')y=val;
  if(part==='m')m=val;
  S.tariffs[kind][idx].from=`${y}-${m}`;
  S.tariffs[kind].sort((a,b)=>a.from.localeCompare(b.from));
  scheduleSave();rApp();
}

function payload(){
  return {tariffs:S.tariffs,fixed:S.fixed,data:S.data,wallbox:S.wb,_summary:hubSummary()};
}
function hubSummary(){
  try{
    const y=new Date().getFullYear(),a=dashData(y);
    const tot=(a.tg||0)+(a.tw||0)+(a.ts||0);
    if(!tot&&a.aut===null)return {k:'—',s:'Noch keine Werte '+y};
    return {k:tot?Cockpit.eurRaw(tot):'—',s:'Kosten '+y+(a.aut!==null?' · Autarkie '+fN(a.aut,0)+' %':'')};
  }catch(e){return {k:'—',s:''};}
}
function saveState(manual){
  Cockpit.save('energie',payload());
  S.dirty=false;S.lastSaved=new Date();
  if(manual)showFeedback('✓ Gespeichert');
}
function migrateFromV1(){
  try{
    const raw=localStorage.getItem(STORE_KEY_V1);
    if(!raw)return false;
    const p=JSON.parse(raw);
    if(p.data)S.data=p.data;
    if(p.year)S.year=p.year;
    const years=Object.keys(S.data).map(Number).filter(n=>!isNaN(n));
    const startYear=years.length?Math.min(...years):S.year;
    const startFrom=`${startYear}-01`;
    const pr=p.prices||{};
    if(pr.gas_ap||pr.gas_gp||pr.gas_bw){
      S.tariffs.gas.push({from:startFrom,ap:pr.gas_ap||'',gp:pr.gas_gp||'',bw:pr.gas_bw||'11.0'});
    }
    if(pr.gas_z)S.fixed.gas_z=pr.gas_z;
    if(pr.w_ap||pr.aw_ap||pr.w_gp){
      S.tariffs.wasser.push({from:startFrom,wap:pr.w_ap||'',awap:pr.aw_ap||'',gp:pr.w_gp||''});
    }
    if(pr.st_ap||pr.st_ep||pr.st_gp){
      S.tariffs.strom.push({from:startFrom,ap:pr.st_ap||'',ep:pr.st_ep||'',gp:pr.st_gp||''});
    }
    return true;
  }catch(e){console.warn('Migration error',e);return false;}
}

function applyData(p){
  S.tariffs=Object.assign({gas:[],wasser:[],strom:[]},p&&p.tariffs||{});
  S.fixed=Object.assign({gas_z:'0.95'},p&&p.fixed||{});
  S.data=(p&&p.data)||{};
  S.wb=Object.assign({sessions:[]},p&&p.wallbox||{});if(!Array.isArray(S.wb.sessions))S.wb.sessions=[];
  if(!S.fixed.gas_z)S.fixed.gas_z='0.95';
}
function loadState(){
  const p=Cockpit.getLocal('energie',null);
  if(p){applyData(p);return;}
  /* Übernahme aus dem alten Dashboard, falls es unter derselben Adresse lief */
  try{
    const raw=localStorage.getItem(STORE_KEY);
    if(raw){applyData(JSON.parse(raw));saveState(false);return;}
    if(migrateFromV1())saveState(false);
  }catch(e){console.warn('Load error',e);}
}
let autoTimer=null;
function scheduleSave(){
  S.dirty=true;
  clearTimeout(autoTimer);
  autoTimer=setTimeout(()=>saveState(false),600);
}
let hideTimer=null;
function showFeedback(msg){
  const el=document.getElementById('esmsg');if(!el)return;
  el.textContent=msg;el.classList.add('vis');
  clearTimeout(hideTimer);
  hideTimer=setTimeout(()=>el.classList.remove('vis'),2800);
}
function updSaveBar(){}

function exportData(){
  const payload={tariffs:S.tariffs,fixed:S.fixed,data:S.data,year:S.year,exported:new Date().toISOString()};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='energieverbrauch_'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showFeedback('✓ Daten exportiert');
}
function importData(file){
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      let p=JSON.parse(e.target.result);
      if(p&&p.data&&p.data.tariffs&&p.bereich==='energie')p=p.data;
      if(!confirm('Daten ersetzen? Aktuelle Eingaben werden überschrieben.'))return;
      if(p.tariffs){
        S.tariffs=Object.assign({gas:[],wasser:[],strom:[]},p.tariffs);
        if(p.fixed)S.fixed=Object.assign({gas_z:'0.95'},p.fixed);
      }else if(p.prices){
        S.tariffs={gas:[],wasser:[],strom:[]};
        if(p.data)S.data=p.data;
        const years=Object.keys(p.data||{}).map(Number).filter(n=>!isNaN(n));
        const startYear=years.length?Math.min(...years):(p.year||new Date().getFullYear());
        const startFrom=`${startYear}-01`;
        const pr=p.prices;
        if(pr.gas_ap||pr.gas_gp||pr.gas_bw)S.tariffs.gas.push({from:startFrom,ap:pr.gas_ap||'',gp:pr.gas_gp||'',bw:pr.gas_bw||'11.0'});
        if(pr.gas_z)S.fixed.gas_z=pr.gas_z;
        if(pr.w_ap||pr.aw_ap||pr.w_gp)S.tariffs.wasser.push({from:startFrom,wap:pr.w_ap||'',awap:pr.aw_ap||'',gp:pr.w_gp||''});
        if(pr.st_ap||pr.st_ep||pr.st_gp)S.tariffs.strom.push({from:startFrom,ap:pr.st_ap||'',ep:pr.st_ep||'',gp:pr.st_gp||''});
      }
      if(p.data)S.data=p.data;
      if(p.year)S.year=p.year;
      saveState(true);rApp();
      showFeedback('✓ Daten importiert');
    }catch(err){alert('Fehler beim Import: '+err.message);}
  };
  reader.readAsText(file);
}
function triggerImport(){document.getElementById('fileInput').click();}
function handleFile(e){const f=e.target.files[0];if(f)importData(f);e.target.value='';}
/* ── CSV-IMPORT VOM WECHSELRICHTER-PORTAL ──
 * Format: Spalten Uhrzeit;Netzbezug[kW];Netzeinspeisung[kW];Stromverbrauch[kW];Akkubeladung[kW];Akkuentnahme[kW];Stromerzeugung[kW];...
 * Zeitstempel: DD.MM.YYYY HH:MM:SS, deutsche Dezimaltrennung (Komma)
 * Logik: Pro Zeile = Leistung × Intervall(h) = Energie, Summe pro Monat
 */
function triggerCsvImport(){document.getElementById('csvInput').click();}
function csvStatus(msg,err){
  const el=document.getElementById('csvStatus');
  if(el){el.textContent=msg;el.style.color=err?'#ff5252':'#7eb8ff';}
}
function parseCsvDate(s){
  /* "25.05.2026 00:00:07" → Date */
  const m=s.match(/^(\d{2})\.(\d{2})\.(\d{4})\s+(\d{2}):(\d{2}):(\d{2})/);
  if(!m)return null;
  return new Date(+m[3],+m[2]-1,+m[1],+m[4],+m[5],+m[6]);
}
function parseCsvNum(s){
  if(!s||!s.trim())return 0;
  return parseFloat(s.replace(',','.'))||0;
}
function aggregateCsv(text){
  /* Erste Zeile = Header, ; als Trenner. Spalten 1-6 = Werte in kW. */
  const lines=text.split(/\r?\n/).filter(l=>l.trim());
  if(lines.length<2)throw new Error('CSV leer oder ohne Daten');
  const header=lines[0].split(';');
  /* Erwartete Spaltennamen (Wechselrichter-Standardformat) */
  const idx={
    bezug:header.findIndex(h=>/Netzbezug/i.test(h)),
    einsp:header.findIndex(h=>/Netzeinspeisung/i.test(h)),
    in:    header.findIndex(h=>/Akkubeladung/i.test(h)),
    out:   header.findIndex(h=>/Akkuentnahme/i.test(h)),
    pv:    header.findIndex(h=>/Stromerzeugung/i.test(h)),
    hv:    header.findIndex(h=>/Stromverbrauch/i.test(h)),
  };
  if(idx.pv<0||idx.einsp<0)throw new Error('Erforderliche Spalten nicht gefunden (Stromerzeugung, Netzeinspeisung).');
  
  /* Datenzeilen parsen */
  const rows=[];
  for(let i=1;i<lines.length;i++){
    const c=lines[i].split(';');
    if(c.length<header.length-1)continue;
    const t=parseCsvDate(c[0]);
    if(!t)continue;
    rows.push({t,c});
  }
  if(!rows.length)throw new Error('Keine gültigen Datenzeilen.');
  
  /* Aggregation pro Monat */
  const monthly={};  /* 'YYYY-M' (M = 0..11) → {pe,pas,pis,bezug,einsp} */
  for(let i=0;i<rows.length;i++){
    const t=rows[i].t,c=rows[i].c;
    /* Intervall = bis zur nächsten Zeile */
    let dt_h;
    if(i+1<rows.length){
      const dt_ms=rows[i+1].t-t;
      dt_h=dt_ms/3600000;
      /* Schutz: wenn negative oder zu große Lücke (>30 min), nehme Standard 5 min */
      if(dt_h<=0||dt_h>0.5)dt_h=5/60;
    }else{
      dt_h=5/60;  /* letzte Zeile */
    }
    const key=t.getFullYear()+'-'+t.getMonth();  /* 0-indexed */
    if(!monthly[key])monthly[key]={pe:0,pas:0,pis:0,bezug:0,einsp:0,hv:0,hasHv:idx.hv>=0,hasB:idx.bezug>=0,tMin:t.getTime(),tMax:t.getTime()};
    monthly[key].tMin=Math.min(monthly[key].tMin,t.getTime());monthly[key].tMax=Math.max(monthly[key].tMax,t.getTime());
    const m=monthly[key];
    m.pe   += parseCsvNum(c[idx.pv])*dt_h;
    m.bezug+= parseCsvNum(c[idx.bezug])*dt_h;
    m.einsp+= parseCsvNum(c[idx.einsp])*dt_h;
    m.pis  += parseCsvNum(c[idx.in])*dt_h;
    m.pas  += parseCsvNum(c[idx.out])*dt_h;
    if(idx.hv>=0)m.hv+=parseCsvNum(c[idx.hv])*dt_h;
  }
  return monthly;
}

let csvProcessing=0,csvParts=[],csvErrors=[];
function handleCsv(ev){
  const files=ev.target.files;
  if(!files.length)return;
  csvParts=[];csvErrors=[];csvProcessing=files.length;
  csvStatus(`Verarbeite ${files.length} Datei(en)…`);
  for(const f of files){
    const reader=new FileReader();
    reader.onload=e=>{
      try{const mAgg=aggregateCsv(e.target.result);for(const k in mAgg)csvParts.push(Object.assign({k,file:f.name},mAgg[k]));}
      catch(err){csvErrors.push(f.name+': '+err.message);}
      if(--csvProcessing===0)finishCsvImport();
    };
    reader.onerror=()=>{csvErrors.push(f.name+': Lesefehler');if(--csvProcessing===0)finishCsvImport();};
    reader.readAsText(f,'utf-8');
  }
  ev.target.value='';
}
/* Import ohne Doppelzählung:
   Pro Monat werden die importierten Zeiträume (z. B. Kalenderwochen) einzeln gemerkt (m.src).
   Gleicher Zeitraum erneut importiert → ersetzt sich selbst. Monatswerte = Summe der Zeiträume.
   Bereits vorhandene Monatswerte (aus früheren Importen oder von Hand) werden erst ersetzt,
   wenn der Monat vollständig abgedeckt ist – so überschreiben z. B. drei Tage nicht den ganzen Monat. */
const SLOT=5*60000;
function monthCoverage(y,m,src){
  const start=new Date(y,m,1).getTime(),end=new Date(y,m+1,1).getTime(),list=Object.values(src);
  if(!list.length)return {complete:false,days:0};
  const t0=Math.min(...list.map(x=>x.t0)),t1=Math.max(...list.map(x=>x.t1));
  const covered=list.reduce((a,x)=>a+(x.t1-x.t0+SLOT),0);
  return {complete:t0<=start+30*60000&&t1>=end-30*60000&&covered>=end-start-3*3600000,days:covered/86400000};
}
function finishCsvImport(){
  if(csvErrors.length){csvStatus('⚠ Fehler: '+csvErrors.join(' | '),true);return;}
  if(!csvParts.length){csvStatus('⚠ Keine Daten gefunden',true);return;}
  const byMonth={};csvParts.forEach(p=>(byMonth[p.k]=byMonth[p.k]||[]).push(p));
  const keys=Object.keys(byMonth).sort((a,b)=>{const[ya,ma]=a.split('-').map(Number),[yb,mb]=b.split('-').map(Number);return ya-yb||ma-mb;});
  /* Vorschau berechnen, ohne zu speichern */
  const plan=keys.map(k=>{
    const[y,m]=k.split('-').map(Number),cur=(S.data[y]&&S.data[y].m[m])||{};
    const src=JSON.parse(JSON.stringify(cur.src||{}));let skipped=0;
    byMonth[k].forEach(p=>{
      const key=p.tMin+'-'+p.tMax,entry={t0:p.tMin,t1:p.tMax,pe:p.pe,pas:p.pas,pis:p.pis,hv:p.hasHv?p.hv:null,xe:p.einsp,xb:p.hasB?p.bezug:null};
      if(src[key]){src[key]=entry;return;}
      /* liegt der neue Zeitraum innerhalb eines vorhandenen → schon enthalten */
      if(Object.values(src).some(x=>x.t0<=p.tMin&&x.t1>=p.tMax)){skipped++;return;}
      /* vorhandene Zeiträume, die ganz im neuen liegen, werden ersetzt */
      Object.keys(src).forEach(q=>{if(src[q].t0>=p.tMin&&src[q].t1<=p.tMax)delete src[q];});
      /* teilweise Überlappung → zur Sicherheit nicht übernehmen */
      if(Object.values(src).some(x=>x.t0<p.tMax&&x.t1>p.tMin)){skipped++;return;}
      src[key]=entry;});
    const cov=monthCoverage(y,m,src);
    const legacy=!cur.srcApplied&&['pe','pas','pis'].some(f=>cur[f]!==undefined&&cur[f]!=='');
    const apply=cov.complete||!legacy;
    return {k,y,m,src,cov,legacy,apply,skipped};
  });
  const sumSrc=(src,f)=>{const v=Object.values(src);if(v.some(x=>x[f]==null))return null;return v.reduce((a,x)=>a+x[f],0);};
  const line=p=>`${MO[p.m]} ${p.y}: ${p.apply?(p.cov.complete?'✓ vollständig':'◐ teilweise ('+Math.round(p.cov.days)+' Tage)')+` – PV ${Math.round(sumSrc(p.src,'pe'))}`+(sumSrc(p.src,'hv')!=null?` · Haus ${Math.round(sumSrc(p.src,'hv'))}`:'')+' kWh':`⏸ bisherige Werte bleiben, bis der Monat vollständig ist (bisher ${Math.round(p.cov.days)} Tage)`}`;
  if(!confirm(`CSV-Import:\n\n${plan.map(line).join('\n')}\n\nJeder Zeitraum zählt nur einmal – erneutes Importieren ist unbedenklich.\n\nFortfahren?`)){csvStatus('Abgebrochen.');return;}
  const r1=v=>v==null?'':(Math.round(v*10)/10).toString();
  let done=0,pending=0;
  plan.forEach(p=>{
    const mm=yd(p.y).m[p.m];mm.src=p.src;
    if(p.apply){['pe','pas','pis','hv','xe','xb'].forEach(f=>{const v=sumSrc(p.src,f);if(v!=null)mm[f]=r1(v);});mm.srcApplied=true;done++;}
    else pending++;
  });
  saveState(false);
  csvStatus(`✓ ${done} Monat(e) übernommen`+(pending?` · ${pending} Monat(e) warten auf die restlichen Wochen`:'')+'.');
  rApp();
}

const toN=v=>{const n=parseFloat(v);return isNaN(n)?null:n};
/* Monatsverbrauch aus Zählerständen. Fehlen Stände, wird die Differenz bis zum nächsten
   bekannten Stand auf die Lückenmonate verteilt (Gewichte: siehe wf, sonst Tage im Monat).
   Geschätzte Monate sind in r.est markiert. */
const DIM=(y,m)=>new Date(y,m+1,0).getDate();
function series(s,ends,y,wf){
  const n=ends.map(toN),r=Array(12).fill(null),est=Array(12).fill(false);
  let p=toN(s),pIdx=-1;
  for(let i=0;i<12;i++){
    if(n[i]===null)continue;
    if(p!==null&&n[i]>=p){
      const diff=n[i]-p;
      if(i-pIdx===1)r[i]=diff;
      else{
        const months=[];for(let k=pIdx+1;k<=i;k++)months.push(k);
        let w=wf?wf(months):null;
        if(!w||w.length!==months.length||w.some(x=>!(x>0)))w=months.map(k=>DIM(y||2001,k));
        const tw=w.reduce((a,b)=>a+b,0);
        months.forEach((k,j)=>{r[k]=diff*w[j]/tw;est[k]=true;});
      }
    }
    p=n[i];pIdx=i;
  }
  r.est=est;return r;
}
/* Anfangsstand eines Jahres: eingetragener Wert, sonst der Dezember-Stand des Vorjahres */
const START_MAP={gas_s:'g',w_s:'w',stb_s:'sb',ste_s:'se',stdg_s:'sdg',stug_s:'sug'};
function startVal(y,key){
  const d=S.data[y];const own=d?d[key]:'';
  if(own!==undefined&&own!==null&&String(own).trim()!=='')return own;
  const p=S.data[y-1];if(!p||!p.m||!p.m[11])return own;
  const dec=p.m[11][START_MAP[key]];
  return (dec!==undefined&&dec!==null&&String(dec).trim()!=='')?dec:own;
}
function startCarried(y,key){const d=S.data[y];return !(d&&d[key]&&String(d[key]).trim()!=='')&&startVal(y,key)!==(d?d[key]:undefined)&&toN(startVal(y,key))!==null;}
/* Nur echte Monatswerte (Vormonat erfasst) – dient als saisonales Profil für Schätzungen */
function exactSeries(s,ends){const n=ends.map(toN),r=[];let p=toN(s);for(let i=0;i<12;i++){r.push(p!==null&&n[i]!==null&&n[i]>=p?n[i]-p:null);p=n[i];}return r;}
function prevProfile(y,startKey,monthKey){
  const d=S.data[y-1];if(!d||!d.m)return null;   /* bewusst kein yd(): legt sonst leere Jahre an */
  const ex=exactSeries(startVal(y-1,startKey),d.m.map(m=>m[monthKey]));
  return months=>months.map(k=>ex[k]);
}

function cG(y){
  const d=yd(y),z=toN(S.fixed.gas_z)||0.95;
  const vols=series(startVal(y,'gas_s'),d.m.map(m=>m.g),y,prevProfile(y,'gas_s','g'));
  return vols.map((vm3,i)=>{
    const t=tariffAt('gas',y,i);
    const ap=t?toN(t.ap)/100:null,gp=t?toN(t.gp):null,bw=t?(toN(t.bw)||11.0):null;
    const v=(vm3!==null && bw!==null)?vm3*bw*z:null;
    return{est:vols.est[i],vm3,v,bw,ap:t?toN(t.ap):null,ak:v!==null&&ap?v*ap:null,gk:gp,tot:v!==null&&ap?v*ap+(gp||0):null,tariff:t};
  });
}
function cW(y){
  const d=yd(y);
  const vols=series(startVal(y,'w_s'),d.m.map(m=>m.w),y,prevProfile(y,'w_s','w'));
  return vols.map((v,i)=>{
    const t=tariffAt('wasser',y,i);
    const wa=t?toN(t.wap):null,aa=t?toN(t.awap):null,gp=t?toN(t.gp):null;
    return{est:vols.est[i],v,wk:v!==null&&wa?v*wa:null,ak:v!==null&&aa?v*aa:null,gk:gp,tot:v!==null&&wa&&aa?v*wa+v*aa+(gp||0):null,tariff:t};
  });
}
/* Unterzähler: Anteil am Gesamtverbrauch des Hauses (Netzbezug + PV-Eigenverbrauch) und
   Aufteilung in PV-/Netzanteil. Annahme mangels Messung: das Geschoss bezieht Strom im selben
   Mix wie das ganze Haus, also gemäß der monatlichen Autarkie. */
function uzSplit(k,v,totV,aut,ap){
  const o={};
  o[k+'P']=(v!==null&&totV)?v/totV*100:null;
  const a=aut!==null?aut/100:null;
  o[k+'PV']=(v!==null&&a!==null)?v*a:null;
  o[k+'Net']=(v!==null&&a!==null)?v*(1-a):null;
  o[k+'NK']=(o[k+'Net']!==null&&ap)?o[k+'Net']*ap:null;
  return o;
}
function cS(y){
  const d=yd(y);
  const pvW=months=>months.map(k=>toN(d.m[k].pe));   /* Einspeisung folgt der PV-Erzeugung */
  const xeW=months=>months.map(k=>toN(d.m[k].xe));   /* … oder besser der von SENEC gemessenen Einspeisung */
  const eFallback=prevProfile(y,'ste_s','se');
  const b=series(startVal(y,'stb_s'),d.m.map(m=>m.sb),y,prevProfile(y,'stb_s','sb')),
        e=series(startVal(y,'ste_s'),d.m.map(m=>m.se),y,months=>{
          const x=xeW(months),w=pvW(months);
          if(x.every(v=>v>0))return x;
          /* einzelne Monate ohne SENEC-Werte: aus der Erzeugung schätzen – mit dem Verhältnis
             Einspeisung/Erzeugung, das SENEC in den übrigen Monaten der Lücke gemessen hat */
          if(w.every(v=>v>0)){let sx=0,sw=0;months.forEach((k,j)=>{if(x[j]>0){sx+=x[j];sw+=w[j];}});
            if(sw>0)return months.map((k,j)=>x[j]>0?x[j]:w[j]*sx/sw);return w;}
          return eFallback?eFallback(months):null;});
  /* Ohne Zählerstände (z. B. fehlender Anfangsstand): SENEC-Einspeisung als Schätzung einsetzen */
  for(let i=0;i<12;i++){if(e[i]===null){const xe=toN(d.m[i].xe);if(xe!==null){e[i]=xe;e.est[i]=true;}}}
  /* Gesamtverbrauch des Hauses je Monat – dient als Verlaufsprofil, wenn Unterzähler-Stände fehlen */
  const houseV=b.map((bi,i)=>{const pe=toN(d.m[i].pe),pas=toN(d.m[i].pas),pis=toN(d.m[i].pis),ei=e[i];
    const pvDir=(pe!==null&&ei!==null&&pis!==null)?Math.max(0,pe-ei-pis):null;
    const ev=(pvDir!==null&&pas!==null)?pvDir+pas:(pvDir!==null?pvDir:(pas!==null?pas:null));
    const hv=toN(d.m[i].hv);if(hv!==null&&hv>0)return hv;
    return (bi!==null&&ev!==null)?bi+ev:null;});
  const uzW=(sK,mK)=>{const pp=prevProfile(y,sK,mK);return months=>{const w=months.map(k=>houseV[k]);return w.every(x=>x>0)?w:(pp?pp(months):null);};};
  const dg=series(startVal(y,'stdg_s'),d.m.map(m=>m.sdg),y,uzW('stdg_s','sdg')),ug=series(startVal(y,'stug_s'),d.m.map(m=>m.sug),y,uzW('stug_s','sug'));
  const hasWB=S.wb&&S.wb.sessions&&S.wb.sessions.length>0;
  return b.map((bi,i)=>{
    const t=tariffAt('strom',y,i);
    const ap=t?toN(t.ap)/100:null,ep=t?toN(t.ep)/100:null,gp=t?toN(t.gp):null;
    const ei=e[i];
    /* PV-Felder: Erzeugung (pe), Aus Speicher (pas), In Speicher (pis) */
    const pe=toN(d.m[i].pe),pas=toN(d.m[i].pas),pis=toN(d.m[i].pis);
    /* PV direkt = Erzeugung − Ins Netz − In Speicher */
    const pvDir=(pe!==null && ei!==null && pis!==null)?Math.max(0,pe-ei-pis):null;
    /* Gesamter PV-Eigenverbrauch = PV direkt + Aus Speicher */
    const ev=(pvDir!==null && pas!==null)?pvDir+pas:(pvDir!==null?pvDir:(pas!==null?pas:null));
    /* Gesamtverbrauch des Hauses: gemessen (SENEC „Stromverbrauch“) oder berechnet aus Bezug + Eigenverbrauch */
    const hv=toN(d.m[i].hv),hvOk=hv!==null&&hv>0;
    const totV=hvOk?hv:((bi!==null && ev!==null)?bi+ev:null);
    /* Autarkie = Eigenverbrauch / Gesamtverbrauch */
    const aut=hvOk&&bi!==null?Math.max(0,Math.min(100,(hv-bi)/hv*100)):((ev!==null && totV!==null && totV>0)?ev/totV*100:null);
    const bk=bi!==null&&ap?bi*ap:null,ek=ei!==null&&ep?ei*ep:null;
    const evk=ev!==null&&ap?ev*ap:null;
    return{totSrc:hvOk?'senec':(totV!==null?'calc':null),bEst:b.est[i],eEst:e.est[i],dgEst:dg.est[i],ugEst:ug.est[i],b:bi,e:ei,pe,pas,pis,pvDir,ev,totV,aut,
      dg:dg[i],ug:ug[i],bk,gk:gp,ek,evk,
      net:bk!==null?bk-(ek||0)+(gp||0):null,
      ...uzSplit('dg',dg[i],totV,aut,ap),...uzSplit('ug',ug[i],totV,aut,ap),
      ...(function(){if(!hasWB)return {wb:null};const w=Wallbox.sum(Wallbox.inMonth(S.wb.sessions,y,i));
        return {wb:w.kwh,wbN:w.n,wbPV:w.pv,wbNet:w.net,wbSolar:w.solar,wbCost:w.price,wbP:(totV&&w.kwh)?w.kwh/totV*100:null};})(),
      tariff:t};
  });
}

const sm=a=>{const v=a.filter(x=>x!==null);return v.length?v.reduce((a,b)=>a+b,0):null};
const fN=(n,d=2)=>n===null?'–':n.toLocaleString('de-DE',{minimumFractionDigits:d,maximumFractionDigits:d});
const fK=n=>n===null?'–':fN(n,0)+'\u202fkWh';
const fM=n=>n===null?'–':fN(n,3)+'\u202fm\u00b3';
const fE=n=>n===null?'–':Cockpit.priv()?'•••\u202f\u20ac':(n<0?'\u2212\u202f':'')+Math.abs(n).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})+'\u202f\u20ac';
const fP=n=>n===null?'–':fN(n,1)+'\u202f%';
function fromLabel(from){if(!from)return '–';const[y,m]=from.split('-');return MO[parseInt(m,10)-1]+' '+y;}

const C={gas:'#F97316',wat:'#38BDF8',stb:'#FACC15',pv:'#00C853',ein:'#C084FC',pvg:'#A3E635',sp:'#2DD4BF',cur:'#E2E8F0',gr:'rgba(255,255,255,.06)',tx:'#5c7aaa'};

function bdg(c,p){if(c===null||p===null||p===0)return'';const d=c-p,pct=d/Math.abs(p)*100;if(Math.abs(pct)<0.5)return`<span class="badge bnt">≈±0%</span>`;return d>0?`<span class="badge bup">+${fN(pct,1)}%</span>`:`<span class="badge bdn">${fN(pct,1)}%</span>`;}

function si(id,v){
  const d=yd(S.year);
  const imap={i_gas:'gas_s',i_was:'w_s',i_stb:'stb_s',i_ste:'ste_s',i_dg:'stdg_s',i_ug:'stug_s'};
  if(imap[id]){d[imap[id]]=v;scheduleSave();return;}
  if(id.startsWith('mg_')){d.m[+id.slice(3)].g=v;}
  else if(id.startsWith('mw_')){d.m[+id.slice(3)].w=v;}
  else if(id.startsWith('mb_')){d.m[+id.slice(3)].sb=v;}
  else if(id.startsWith('me_')){d.m[+id.slice(3)].se=v;}
  else if(id.startsWith('mp_')){d.m[+id.slice(3)].sev=v;}
  else if(id.startsWith('md_')){d.m[+id.slice(3)].sdg=v;}
  else if(id.startsWith('mu_')){d.m[+id.slice(3)].sug=v;}
  else if(id.startsWith('mpe_')){d.m[+id.slice(4)].pe=v;}
  else if(id.startsWith('mpas_')){d.m[+id.slice(5)].pas=v;}
  else if(id.startsWith('mpis_')){d.m[+id.slice(5)].pis=v;}
  else if(id==='fix_z'){S.fixed.gas_z=v;}
  scheduleSave();
}

function estHint(){

function updW(){const c=cW(S.year);c.forEach((ci,i)=>{setT('wv'+i,fM(ci.v));setT('wwk'+i,fE(ci.wk));setT('wak'+i,fE(ci.ak));setT('wg'+i,fE(ci.gk));setT('wt'+i,fE(ci.tot));setT('wtr'+i,ci.tariff?fromLabel(ci.tariff.from):'–');});}
function updS(){const c=cS(S.year);c.forEach((ci,i)=>{setT('sbv'+i,fK(ci.b));setT('sev'+i,fK(ci.e));setT('sbk'+i,fE(ci.bk));setT('sek'+i,ci.ek!==null?'+\u202f'+fE(ci.ek):'–');setT('spvk'+i,ci.evk!==null?'\u2248\u202f'+fE(ci.evk):'–');setT('snet'+i,fE(ci.net));setT('str'+i,ci.tariff?fromLabel(ci.tariff.from):'–');setT('spvd'+i,fK(ci.pvDir));setT('spas'+i,fK(ci.pas));setT('sev_all'+i,fK(ci.ev));});}
function updSPV(){const c=cS(S.year);c.forEach((ci,i)=>{setT('sev'+i,fK(ci.e));setT('sbv'+i,fK(ci.b));});}
function updUZ(w){const c=cS(S.year),k=w==='dg'?'dg':'ug';c.forEach((ci,i)=>{setT('uzv'+i,fK(ci[k]));setT('uzp'+i,fP(ci[k+'P'])+(ci[k+'P']!==null&&ci[k+'P']>100?' ⚠':''));setT('uzpv'+i,fK(ci[k+'PV']));setT('uznet'+i,fK(ci[k+'Net']));setT('uznk'+i,fE(ci[k+'NK']));setT('uzt'+i,fK(ci.totV));});}

function dashData(yr){
  const gc=cG(yr),wc=cW(yr),sc=cS(yr);
  const tev=sm(sc.map(x=>x.ev)),tB=sm(sc.map(x=>x.b));
  const tV=(tev!==null&&tB!==null)?tev+tB:null;
  const yAut=(tev!==null&&tV!==null&&tV>0)?tev/tV*100:null;
  return{gc,wc,sc,
    tg:sm(gc.map(x=>x.tot)),tw:sm(wc.map(x=>x.tot)),ts:sm(sc.map(x=>x.net)),
    tein:sm(sc.map(x=>x.ek)),tev,tevk:sm(sc.map(x=>x.evk)),
    tPE:sm(sc.map(x=>x.pe)),tPVD:sm(sc.map(x=>x.pvDir)),tPAS:sm(sc.map(x=>x.pas)),
    aut:yAut,gesV:tV,
    gV:sm(gc.map(x=>x.v)),wV:sm(wc.map(x=>x.v)),sB:tB,sE:sm(sc.map(x=>x.e))};
}

    <div class="esc"><div class="esc-l">${dot(C.pv)} PV-Eigenverbrauch</div><div class="esc-v" style="color:${C.pv}">${fK(a.tev)}</div><div class="esc-s">direkt ${fK(a.tPVD)} · Sp. ${fK(a.tPAS)}</div></div>

function updDashboard(){
  if(!document.getElementById('dashContainer'))return;
  document.getElementById('dashContainer').innerHTML=rDashboard();
  setTimeout(doCharts,30);
}
function doCharts(){
  const yr=S.year,pyr=yr-1;
  const a=dashData(yr),b=dashData(pyr);
  const base={responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{titleFont:{size:11},bodyFont:{size:11}}},
    scales:{x:{ticks:{color:C.tx,font:{size:10},autoSkip:false,maxRotation:0},grid:{color:C.gr}},
            y:{ticks:{color:C.tx,font:{size:10}},grid:{color:C.gr},beginAtZero:true}}};
  mkC('chCost',{type:'bar',data:{labels:MO,datasets:[
    {label:'Gas',data:a.gc.map(c=>c.tot),backgroundColor:C.gas,stack:'k'},
    {label:'Wasser',data:a.wc.map(c=>c.tot),backgroundColor:C.wat,stack:'k'},
    {label:'Strom',data:a.sc.map(c=>c.net),backgroundColor:C.stb,stack:'k'}]},
    options:{...base,scales:{x:{...base.scales.x,stacked:true},y:{...base.scales.y,stacked:true,ticks:{...base.scales.y.ticks,callback:v=>v+'€'}}}}});
  mkC('chGas',{type:'bar',data:{labels:MO,datasets:[{label:'kWh',data:a.gc.map(c=>c.v),backgroundColor:C.gas}]},
    options:{...base,scales:{...base.scales,y:{...base.scales.y,ticks:{...base.scales.y.ticks,callback:v=>v+' kWh'}}}}});
  mkC('chWas',{type:'bar',data:{labels:MO,datasets:[{label:'m³',data:a.wc.map(c=>c.v),backgroundColor:C.wat}]},
    options:{...base,scales:{...base.scales,y:{...base.scales.y,ticks:{...base.scales.y.ticks,callback:v=>v+' m³'}}}}});
  mkC('chStrom',{type:'bar',data:{labels:MO,datasets:[
    {label:'Bezug',data:a.sc.map(c=>c.b),backgroundColor:C.stb},
    {label:'Einsp.',data:a.sc.map(c=>c.e),backgroundColor:C.ein},
    {label:'PV-EV',data:a.sc.map(c=>c.ev),backgroundColor:C.pv}]},
    options:{...base,scales:{...base.scales,y:{...base.scales.y,ticks:{...base.scales.y.ticks,callback:v=>v+' kWh'}}}}});
  /* PV-Bilanz: Erzeugung als Linie, darunter PV direkt + PV aus Speicher + Einspeisung als gestapelte Balken */
  mkC('chPV',{type:'bar',data:{labels:MO,datasets:[
    {type:'bar',label:'PV direkt',data:a.sc.map(c=>c.pvDir),backgroundColor:C.pv,stack:'p'},
    {type:'bar',label:'PV aus Speicher',data:a.sc.map(c=>c.pas),backgroundColor:C.sp,stack:'p'},
    {type:'bar',label:'Einspeisung',data:a.sc.map(c=>c.e),backgroundColor:C.ein,stack:'p'},
    {type:'line',label:'Erzeugung',data:a.sc.map(c=>c.pe),borderColor:C.pvg,backgroundColor:C.pvg,borderWidth:2,pointRadius:3,fill:false,tension:.2}]},
    options:{...base,plugins:{...base.plugins,tooltip:{...base.plugins.tooltip,mode:'index'}},scales:{x:{...base.scales.x,stacked:true},y:{...base.scales.y,stacked:true,ticks:{...base.scales.y.ticks,callback:v=>v+' kWh'}}}}});
  /* Autarkie pro Monat */
  mkC('chAut',{type:'bar',data:{labels:MO,datasets:[{label:'Autarkie',data:a.sc.map(c=>c.aut),backgroundColor:C.pv}]},
    options:{...base,scales:{...base.scales,y:{...base.scales.y,max:100,ticks:{...base.scales.y.ticks,callback:v=>v+'%'}}}}});
  const cats=['Gas','Wasser/AW','Strom','Gesamt'];
  const pv=[b.tg,b.tw,b.ts,(b.tg||0)+(b.tw||0)+(b.ts||0)];
  const cv=[a.tg,a.tw,a.ts,(a.tg||0)+(a.tw||0)+(a.ts||0)];
  mkC('chComp',{type:'bar',data:{labels:cats,datasets:[
    {label:String(pyr),data:pv,backgroundColor:C.tx},
    {label:String(yr),data:cv,backgroundColor:C.cur}]},
    options:{...base,scales:{...base.scales,y:{...base.scales.y,ticks:{...base.scales.y.ticks,callback:v=>v+'€'}}}}});
  /* kumulierte Reihen; Monate ohne Wert unterbrechen die Linie nicht, sondern bleiben leer */
  const cum=arr=>{let s=0;return arr.map(v=>{if(v===null||v===undefined)return null;s+=v;return Math.round(s*10)/10;});};
  const gT=cum(a.gc.map(c=>c.v)),sT=cum(a.sc.map(c=>c.b)),hT=cum(a.sc.map(c=>c.totV)),wT=cum(a.wc.map(c=>c.vm3!==undefined?c.vm3:c.v));
  const tOpt=unit=>({...base,plugins:{...base.plugins,legend:{display:false},tooltip:{callbacks:{label:ctx=>ctx.dataset.label+': '+(ctx.parsed.y||0).toLocaleString('de-DE',{maximumFractionDigits:1})+' '+unit}}},
    scales:{...base.scales,y:{...base.scales.y,beginAtZero:true,ticks:{...base.scales.y.ticks,callback:v=>v.toLocaleString('de-DE')}}}});
  const ln=(label,data,col,dash)=>({label,data,borderColor:col,backgroundColor:col+'33',tension:.3,fill:false,pointRadius:2,spanGaps:true,borderDash:dash||[]});
  mkC('chTrendG',{type:'line',data:{labels:MO,datasets:[ln('Gas',gT,C.gas)]},options:tOpt('kWh')});
  mkC('chTrendS',{type:'line',data:{labels:MO,datasets:[ln('Hausverbrauch',hT,C.pv,[4,3]),ln('Strombezug',sT,C.stb)]},options:tOpt('kWh')});
  mkC('chTrendW',{type:'line',data:{labels:MO,datasets:[ln('Wasser',wT,C.wat)]},options:tOpt('m³')});
}

function rTariffBlock(kind){
  const list=[...S.tariffs[kind]].sort((a,b)=>a.from.localeCompare(b.from));
  const fields=TARIFFS[kind];
  let rows='';
  if(!list.length){
    rows=`<tr><td colspan="${fields.length+2}" class="tariff-empty">Noch keine Tarifperiode angelegt. Klicken Sie auf „+ Tarifperiode" um die erste anzulegen.</td></tr>`;
  }else{
    rows=list.map(t=>{
      const origIdx=S.tariffs[kind].indexOf(t);
      const cur=t.from||(new Date().getFullYear()+'-01');
      const[fy,fm]=cur.split('-');
      const years=[];for(let yy=2020;yy<=2040;yy++)years.push(yy);
      return `<tr>
        <td><div class="tariff-from">
          <select class="sel-y" onchange="updTariffFromPart('${kind}',${origIdx},'y',this.value)">
            ${years.map(y=>`<option value="${y}" ${String(y)===fy?'selected':''}>${y}</option>`).join('')}
          </select>
          <select class="sel-m" onchange="updTariffFromPart('${kind}',${origIdx},'m',this.value)">
            ${MO.map((mn,i)=>{const mv=String(i+1).padStart(2,'0');return `<option value="${mv}" ${mv===fm?'selected':''}>${mn}</option>`;}).join('')}
          </select>
        </div></td>
        ${fields.map(f=>`<td><input type="number" value="${t[f.key]||''}" step="${f.step}" oninput="updTariff('${kind}',${origIdx},'${f.key}',this.value)"></td>`).join('')}
        <td><button class="btn-del" onclick="delTariff('${kind}',${origIdx})" title="Periode löschen">🗑</button></td>
      </tr>`;
    }).join('');
  }
  return `<div class="tariff-block">
    <div class="tariff-block-t">
      <span>${dot(TARIFF_DOTS[kind])} ${TARIFF_NAMES[kind]}</span>
      <button class="btn btn-sm btn-add" onclick="addTariff('${kind}')">+ Tarifperiode</button>
    </div>
    <div class="etw tariff-table"><table>
      <thead><tr>
        <th>Gültig ab</th>
        ${fields.map(f=>`<th>${f.label}<br><span style="font-weight:400;color:#5c7aaa">${f.unit}</span></th>`).join('')}
        <th></th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
  </div>`;
}

      Beispiel: Eine Periode ab „Jan 2024" und eine ab „Apr 2024" → Jan–Mär nutzt die erste, ab April die zweite. So lassen sich Preisänderungen unterjährig (zum 01. eines Monats) erfassen.

function wbApply(text){
  const list=Wallbox.parse(text);
  if(!list){showFeedback('⚠ Format nicht erkannt – bitte den Text von /api/sessions vollständig kopieren');return;}
  if(!list.length){showFeedback('⚠ Keine Ladungen im Text gefunden');return;}
  const before=(S.wb.sessions||[]).length;
  S.wb.sessions=Wallbox.mergeSessions(S.wb.sessions,list);
  const neu=S.wb.sessions.length-before;
  saveState(false);rApp();
  showFeedback('✓ '+neu+' neue Ladung'+(neu===1?'':'en')+' übernommen'+(list.length-neu>0?' · '+(list.length-neu)+' schon vorhanden':''));
}

    const rest=(ci.totV!==null&&parts.every(v=>v!==null))?ci.totV-parts.reduce((a,b)=>a+b,0):null;
    return Object.assign({},ci,{rest,wb:useWB?(ci.wb||0):null});});
  const KEYS=[['dg','DG','#C084FC'],['ug','UG','#22B8CF']].concat(useWB?[['wb','Wallbox','#F97316']]:[]).concat([['rest','Hauptwohnung','#FACC15']]);

  /* Jahreswerte nur über Monate, in denen alle Teile vorliegen – sonst ergänzen sich die Prozente nicht zu 100 % */
  const full=rows.filter(r=>r.rest!==null);
  const tT=full.reduce((a,r)=>a+r.totV,0);
  const tot=k=>full.reduce((a,r)=>a+(r[k]||0),0);
  const estCls=(r,k)=>{const house=r.totSrc==='calc'&&(r.bEst||r.eEst);
    const on=k==='dg'?r.dgEst:k==='ug'?r.ugEst:k==='rest'?(r.dgEst||r.ugEst||house):false;return on?' est':'';};
  const bar=r=>{if(!r.totV||r.rest===null)return '';const seg=(v,col)=>v>0?`<i style="display:inline-block;height:8px;width:${(v/r.totV*100).toFixed(1)}%;background:${col}"></i>`:'';
    return `<div style="display:flex;width:120px;background:var(--field);border-radius:4px;overflow:hidden">${KEYS.map(k=>seg(Math.max(0,r[k[0]]||0),k[2])).join('')}</div>`;};
  const skipped=rows.filter(r=>r.totV!==null&&r.rest===null).length;
  return `<style>.vtp{display:block;font-size:10px;color:var(--muted);font-weight:400;font-style:normal;margin-top:1px}.ecard td.est .vtp{color:#c9a27a}.ecard td.est .vtp::before{content:""}</style>
<div class="tariff-info">Die Hauptwohnung braucht keinen eigenen Zähler: Sie ergibt sich als <b>Rest</b> aus dem Gesamtverbrauch des Hauses minus ${useWB?'Dachgeschoss, Untergeschoss und Wallbox':'Dachgeschoss und Untergeschoss'}. Unter jedem Wert steht sein <b>Anteil am Hausverbrauch</b>. Fehlen bei DG oder UG Zählerstände, werden sie nach dem Verbrauchsverlauf des Hauses verteilt – dafür reicht es, die Unterzähler z.&nbsp;B. quartalsweise abzulesen.</div>
<div class="eleg"><div class="eli"><span style="color:#69f0ae">●</span>&nbsp;gemessen (SENEC)</div>${KEYS.map(k=>`<div class="eli"><div class="els" style="background:${k[2]}"></div>${k[0]==='rest'?'Hauptwohnung (Rest)':k[1]}</div>`).join('')}</div>
<div class="etw"><table><thead><tr><th>Monat</th><th>Haus gesamt</th>${KEYS.map(k=>`<th>${k[1]}</th>`).join('')}<th>Aufteilung</th></tr></thead>
<tbody>${rows.map((r,i)=>`<tr><td>${MO[i]}</td><td class="${r.totV===null?'evm':''}${r.totSrc==='calc'&&(r.bEst||r.eEst)?' est':''}" title="${r.totSrc==='senec'?'gemessen (SENEC)':'berechnet'}">${fK(r.totV)}${r.totSrc==='senec'?' <span style="color:#69f0ae;font-size:10px">●</span>':''}</td>
${KEYS.map(k=>{const v=r[k[0]],neg=k[0]==='rest'&&v!==null&&v<0;
  return `<td class="${v===null?'evm':''}${v!==null?estCls(r,k[0]):''}" style="${neg?'color:#ff8a80':k[0]==='rest'&&v!==null?'font-weight:600':''}">${fK(v)}${neg?' ⚠':''}${r.rest!==null?pct(v,r.totV):''}</td>`;}).join('')}
<td>${bar(r)}</td></tr>`).join('')}</tbody>
<tfoot><tr class="etot"><td>Gesamt ${yr}</td><td>${full.length?fK(tT):'–'}</td>${KEYS.map(k=>`<td>${full.length?fK(tot(k[0]))+pct(tot(k[0]),tT):'–'}</td>`).join('')}<td></td></tr></tfoot></table></div>
<div class="efn">${rows.some(r=>r.totSrc==='senec')?'<b>Haus gesamt</b> stammt – wo vorhanden – aus dem von SENEC <b>gemessenen</b> Hausverbrauch (Spalte „Stromverbrauch“ im CSV-Import), sonst aus Netzbezug + PV-Eigenverbrauch berechnet. ':'💡 Genauer wird es mit dem gemessenen Hausverbrauch: Importiere die SENEC-CSV-Dateien unter „PV-Daten“ einfach noch einmal, dann wird die Spalte „Stromverbrauch“ mit übernommen. '}
Die <b>Gesamtzeile</b> umfasst nur Monate, in denen alle Werte vorliegen${skipped?` (${skipped} Monat${skipped===1?'':'e'} ohne Unterzähler-Werte nicht enthalten)`:''} – so ergänzen sich die Anteile zu 100&nbsp;%.
Ein negativer Rest (⚠) bedeutet, dass die Unterzähler zusammen mehr zeigen als das ganze Haus verbraucht hat – meist stimmen dann PV-Daten oder ein Zählerstand nicht.${useWB?' Wallbox-Werte stammen aus evcc; Monate ohne Ladung zählen mit 0.':''}</div>`;
}

function rData(){
  const years=Object.keys(S.data).filter(y=>S.data[y]&&S.data[y].m&&S.data[y].m.some(m=>Object.values(m).some(v=>v!==''))).sort();
  return `<div class="ecard"><div class="ecard-t">💾 Daten</div>
    <div class="tariff-info">Deine Energiedaten werden automatisch gespeichert und ${Cockpit.configured()?'mit deinem privaten GitHub-Repo synchronisiert.':'bisher nur auf diesem Gerät abgelegt – <a href="../einstellungen.html" style="color:#7eb8ff">Sync einrichten</a>.'}<br>
    Jahre mit Werten: <b>${years.length?years.join(', '):'noch keine'}</b> · Tarifperioden: Gas ${S.tariffs.gas.length}, Wasser ${S.tariffs.wasser.length}, Strom ${S.tariffs.strom.length}</div>
    <div class="ecard-t" style="border:none;padding:0;margin:16px 0 8px">⬆ Import aus dem alten Dashboard</div>
    <div style="font-size:12px;color:#8fa6cc;margin-bottom:10px;line-height:1.5">Wähle deine Export-Datei (z.&nbsp;B. <code>energieverbrauch_2026-09-30.json</code>). Tarife, Zählerstände und PV-Werte werden vollständig übernommen und <b>ersetzen</b> die aktuellen Energiedaten.</div>
    <button class="btn btn-pri" onclick="triggerImport()">📁 JSON-Datei wählen</button>
    <input type="file" id="fileInput" accept=".json,application/json" onchange="handleFile(event)">
    <div class="ecard-t" style="border:none;padding:0;margin:22px 0 8px">⬇ Sicherung</div>
    <button class="btn" onclick="exportData()">⬇ Export als JSON</button>
    <div class="ecard-t" style="border:none;padding:0;margin:22px 0 8px;color:#ff5252">Gefahrenzone</div>
    <button class="btn" onclick="clearAll()" style="color:#ff5252;border-color:#ff525255">🗑 Alle Energiedaten löschen</button>
  </div>`;
}
function yearBar(){
  return `<div class="yrbar"><div class="eyrw"><button class="eyrb" onclick="chYr(-1)" aria-label="Vorjahr">&#8249;</button><span class="eyrv">${S.year}</span><button class="eyrb" onclick="chYr(1)" aria-label="Folgejahr">&#8250;</button></div><span class="esmsg" id="esmsg"></span></div>`;
}
function rApp(){
  const tabs=[{id:'uebersicht',lbl:'📊 Übersicht'},{id:'gas',lbl:'Gas',c:'gas'},{id:'wasser',lbl:'Wasser',c:'wat'},{id:'strom',lbl:'Strom',c:'stb'},{id:'preise',lbl:'⚙️ Tarife'},{id:'daten',lbl:'💾 Daten'}];
  let cnt='';
  if(S.tab==='uebersicht')cnt=yearBar()+estHint()+`<div id="dashContainer">${rDashboard()}</div>`;
  else if(S.tab==='gas')cnt=yearBar()+estHint()+rGas();
  else if(S.tab==='wasser')cnt=yearBar()+estHint()+rWas();
  else if(S.tab==='strom')cnt=yearBar()+estHint()+rStrom();
  else if(S.tab==='preise')cnt=`<span class="esmsg" id="esmsg"></span>`+rPreise();
  else cnt=`<span class="esmsg" id="esmsg"></span>`+rData();
  document.getElementById('tabs').innerHTML=tabs.map(t=>`<button class="tab${S.tab===t.id?' on':''}" onclick="stab('${t.id}')">${t.c?dot(C[t.c])+' ':''}${t.lbl}</button>`).join('');
  document.getElementById('eapp').innerHTML=cnt;
  markEst();
  if(S.tab==='uebersicht')setTimeout(doCharts,40);
}
function stab(t){S.tab=t;rApp();window.scrollTo(0,0);}
function sst(t){S.st=t;rApp();}
function chYr(d){S.year+=d;try{localStorage.setItem('cockpit:energie:year',String(S.year));}catch(e){}rApp();}

/* Zwei Stände zusammenführen: Felder, die nur ein Gerät ausgefüllt hat, bleiben erhalten;
   bei unterschiedlichen Werten gewinnt der neuere Stand. Tarife kommen vom neueren Stand. */
function mergeEnergie(l,r,lU,rU){
  const newer=lU>=rU?l:r,older=lU>=rU?r:l;
  const pick=(a,b)=>(a===b?a:(a===''||a==null)?b:(b===''||b==null)?a:a);
  const out={tariffs:JSON.parse(JSON.stringify(newer.tariffs||{gas:[],wasser:[],strom:[]})),
    fixed:Object.assign({},older.fixed||{},newer.fixed||{}),data:{}};
  const ys=new Set(Object.keys(newer.data||{}).concat(Object.keys(older.data||{})));
  ys.forEach(y=>{
    const n=(newer.data||{})[y],o=(older.data||{})[y];
    if(!n||!o){out.data[y]=JSON.parse(JSON.stringify(n||o));return;}
    const yr={};
    Object.keys(Object.assign({},o,n)).forEach(k=>{if(k!=='m')yr[k]=pick(n[k],o[k]);});
    yr.m=Array.from({length:12},(_,i)=>{const nm=(n.m||[])[i]||{},om=(o.m||[])[i]||{},mm={};
      Object.keys(Object.assign({},om,nm)).forEach(k=>mm[k]=pick(nm[k],om[k]));return mm;});
    out.data[y]=yr;
  });
  out.wallbox={sessions:Wallbox.mergeSessions((older.wallbox||{}).sessions,(newer.wallbox||{}).sessions)};
  const saved={t:S.tariffs,f:S.fixed,d:S.data,w:S.wb};
  S.tariffs=out.tariffs;S.fixed=out.fixed;S.data=out.data;S.wb=out.wallbox;out._summary=hubSummary();
  S.tariffs=saved.t;S.fixed=saved.f;S.data=saved.d;S.wb=saved.w;
  return out;
}
Cockpit.registerMerge('energie',mergeEnergie);

if(typeof Chart!=='undefined'){Chart.defaults.color='#5c7aaa';Chart.defaults.borderColor='rgba(255,255,255,.06)';Chart.defaults.font.family="'DM Sans','Segoe UI',system-ui,sans-serif";}
S.tab='uebersicht';
loadState();rApp();
try{const _p=Cockpit.getLocal('energie',null);if(_p&&_p._summary&&/•••/.test(JSON.stringify(_p._summary)))saveState(false);}catch(e){}
window.addEventListener('cockpit:priv',()=>rApp());
Cockpit.autoPull(['energie'],function(a,d){if(d){applyData(d);rApp();}});

</script>
